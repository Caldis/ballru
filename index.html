<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BALLRU · 环爆模拟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ffb454' stroke-width='3' stroke-dasharray='9 4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff3e0'/%3E%3C/svg%3E">
<style>
:root{
  --acc:#ffb454;
  --ink:rgba(9,13,26,.84);
  --line:rgba(170,200,255,.10);
  --tx:#c9d5ef;
  --dim:#5e6b8c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060e;overscroll-behavior:none}
.tBody,.pageBody{touch-action:pan-y}
button,select{-webkit-tap-highlight-color:transparent}
body{
  font-family:Bahnschrift,'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
  color:var(--tx);-webkit-font-smoothing:antialiased;user-select:none;
}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

/* ── 标题字 / 快捷键提示 ─────────────────── */
.mark{
  font-size:clamp(58px,13vw,134px);font-weight:700;letter-spacing:.06em;text-indent:.06em;
  color:#f2f6ff;line-height:1;
  text-shadow:0 0 34px rgba(120,160,255,.38),3px 0 0 rgba(255,92,58,.5),-3px 0 0 rgba(64,164,255,.5);
}
.markSub{margin-top:14px;font-size:13px;letter-spacing:.54em;text-indent:.54em;color:var(--dim)}
.keysHint{
  position:absolute;bottom:26px;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px 18px;
  justify-content:center;font-size:11.5px;color:var(--dim);letter-spacing:.08em;padding:0 16px;
}
kbd{
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:1px 6px;font:inherit;color:var(--tx);background:rgba(255,255,255,.045);
}

/* ── 调参控制台 ─────────────────────────── */
#tuner{
  position:fixed;top:12px;right:12px;bottom:12px;width:min(304px,86vw);z-index:20;
  display:flex;flex-direction:column;
  background:var(--ink);
  backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .35s;
}
body.tunerAway #tuner{transform:translateX(calc(100% + 26px))}
body.bare #tuner,body.bare #tunerTab{opacity:0;pointer-events:none}
#tunerTab{
  position:fixed;top:12px;right:12px;z-index:19;
  padding:7px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);backdrop-filter:blur(12px);color:var(--dim);
  font:700 11px/1 inherit;font-family:inherit;letter-spacing:.22em;text-indent:.22em;
  cursor:pointer;transition:color .2s,border-color .2s,opacity .35s;
}
#tunerTab:hover{color:var(--acc);border-color:var(--acc)}
.tHead{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.tDot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:background .6s,box-shadow .6s}
.tTitle{font-size:14px;letter-spacing:.24em;font-weight:700;color:#e8eefc;flex:1}
.tHide{
  border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px;
  font-family:inherit;padding:2px 6px;transition:color .2s;
}
.tHide:hover{color:var(--acc)}
.tBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0 10px;scrollbar-width:thin;scrollbar-color:rgba(140,170,230,.22) transparent}
.tBody::-webkit-scrollbar{width:5px}
.tBody::-webkit-scrollbar-thumb{background:rgba(140,170,230,.22);border-radius:3px}
.tFoot{flex:none;padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);letter-spacing:.05em;line-height:1.7}

.presetRow{display:flex;gap:6px;padding:12px 14px 4px;flex-wrap:wrap}
.chip{
  flex:1;min-width:62px;padding:7px 4px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);
  font-family:inherit;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;
  transition:border-color .2s,color .2s,background .2s;
}
.chip:hover{border-color:var(--acc);color:var(--acc);background:rgba(255,180,84,.06)}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 14px 12px}
.btn{
  padding:8px 6px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--tx);
  font-family:inherit;font-size:12px;letter-spacing:.08em;
  transition:border-color .2s,color .2s,background .2s;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.acc{border-color:var(--acc);color:var(--acc)}
.btn.acc:hover{background:rgba(255,180,84,.12)}

.grp{border-bottom:1px solid rgba(170,200,255,.05)}
.grpHead{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px 9px;cursor:pointer;
  font-size:10.5px;letter-spacing:.26em;color:var(--dim);
  transition:color .2s;
}
.grpHead:hover{color:var(--tx)}
.grpHead .car{transition:transform .3s;font-size:8px;color:var(--acc)}
.grp.closed .car{transform:rotate(-90deg)}
.grpBody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.22,1,.36,1)}
.grp.closed .grpBody{grid-template-rows:0fr}
.grpIn{overflow:hidden;min-height:0}

.row{display:grid;grid-template-columns:88px 1fr 50px;align-items:center;gap:8px;padding:4px 16px;cursor:default}
.row:hover{background:rgba(255,255,255,.025)}
.row.alt{grid-template-columns:1fr auto}
.rLab{font-size:12px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rVal{font-size:12px;color:var(--acc);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:20px;
  background:transparent;cursor:ew-resize;--fill:50%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;border-radius:1px;
  background:linear-gradient(var(--acc),var(--acc)) 0/var(--fill) 100% no-repeat,rgba(160,190,255,.16);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;margin-top:-4px;
  background:#0b1020;border:1.5px solid var(--acc);border-radius:2px;
  box-shadow:0 0 8px rgba(255,180,84,.45);
}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:rgba(160,190,255,.16)}
input[type=range]::-moz-range-progress{height:2px;border-radius:1px;background:var(--acc)}
input[type=range]::-moz-range-thumb{
  width:9px;height:9px;background:#0b1020;border:1.5px solid var(--acc);border-radius:2px;
}

.tog{position:relative;width:32px;height:17px;cursor:pointer;justify-self:end}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog i{
  position:absolute;inset:0;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);transition:background .2s,border-color .2s;
}
.tog i::after{
  content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:3px;
  background:var(--dim);transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s;
}
.tog input:checked + i{border-color:var(--acc);background:rgba(255,180,84,.13)}
.tog input:checked + i::after{transform:translateX(15px);background:var(--acc)}

select{
  background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:6px;
  font-family:inherit;font-size:11.5px;padding:4px 6px;cursor:pointer;outline:none;
  justify-self:end;max-width:130px;
}
select:focus{border-color:var(--acc)}

/* ── 主菜单 / 商店 / 设置 ───────────────── */
#menu{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(4,7,16,.18) 0%,rgba(3,5,12,.84) 80%);
  transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s;
}
#menu.gone{opacity:0;visibility:hidden}
.menuWrap{text-align:center;max-width:92vw}
.menuWrap .mark{font-size:clamp(44px,9vw,96px)}
.dustBar{
  display:flex;gap:26px;justify-content:center;margin:14px 0 4px;
  font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums;
}
.dustBar .du{color:var(--acc)}
.dustBar .co{color:#ffd76a}
.menuCard{
  margin:18px auto 0;width:min(400px,92vw);text-align:left;
  background:var(--ink);backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;max-height:min(62vh,560px);
}
.menuNav{display:flex;flex-direction:column;gap:8px;padding:16px}
.mBtn{
  width:100%;padding:12px 16px;border-radius:10px;cursor:pointer;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);
  font-family:inherit;font-size:14px;letter-spacing:.1em;
  transition:border-color .2s,color .2s,background .2s,transform .15s;
  display:flex;justify-content:space-between;align-items:center;
}
.mBtn:hover{border-color:var(--acc);color:var(--acc);transform:translateX(3px)}
.mBtn.acc{border-color:var(--acc);color:var(--acc);background:rgba(255,180,84,.08)}
.mBtn.nova{border-color:#ffd76a;color:#ffd76a;background:rgba(255,215,106,.07)}
.mBtn.nova:hover{background:rgba(255,215,106,.16)}
.mBtn small{color:var(--dim);font-size:11px;letter-spacing:.05em}
.menuPage{display:none;flex-direction:column;min-height:0}
.menuPage.on{display:flex}
.pageHead{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);flex:none;
}
.pageHead b{font-size:13px;letter-spacing:.22em;color:#e8eefc;flex:1}
.backBtn{
  border:none;background:none;color:var(--dim);cursor:pointer;
  font-family:inherit;font-size:12px;letter-spacing:.1em;padding:3px 8px;
}
.backBtn:hover{color:var(--acc)}
.pageBody{flex:1;overflow-y:auto;padding:10px 14px 16px;scrollbar-width:thin}
.pageBody::-webkit-scrollbar{width:5px}
.pageBody::-webkit-scrollbar-thumb{background:rgba(140,170,230,.22);border-radius:3px}
.shopSec{font-size:10.5px;letter-spacing:.26em;color:var(--dim);margin:12px 2px 6px}
.shopRow{
  display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
  padding:9px 8px;border-radius:10px;
}
.shopRow:hover{background:rgba(255,255,255,.03)}
.shopIcon{font-size:19px;text-align:center;color:var(--acc)}
.shopName{font-size:13px;color:#e8eefc}
.shopName .pips{margin-left:8px;font-size:9px;letter-spacing:2px;color:var(--acc)}
.shopName .pips .off{color:rgba(140,170,230,.25)}
.shopDesc{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.45}
.buyBtn{
  min-width:84px;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:center;
  border:1px solid var(--acc);background:transparent;color:var(--acc);
  font-family:inherit;font-size:12px;font-variant-numeric:tabular-nums;
  transition:background .2s,opacity .2s;
}
.buyBtn:hover{background:rgba(255,180,84,.12)}
.buyBtn:disabled{opacity:.32;cursor:default;border-color:var(--line);color:var(--dim)}
.buyBtn.maxed{border-color:#ffd76a;color:#ffd76a;opacity:.8}
.setRow{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px;padding:7px 6px}
.setRow.alt{grid-template-columns:1fr auto}
.setRow .rLab{font-size:13px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px}
.statBox{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.statBox b{display:block;font-size:19px;color:#f2f6ff;font-variant-numeric:tabular-nums}
.statBox span{font-size:10px;color:var(--dim);letter-spacing:.14em}
.saveTa{
  width:100%;height:84px;resize:none;background:#070b16;color:var(--tx);
  border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;
  font:11px/1.5 Consolas,monospace;outline:none;user-select:text;
}
.saveTa:focus{border-color:var(--acc)}
.dangerBtn{border-color:rgba(255,90,90,.5)!important;color:#ff7a7a!important}
.dangerBtn:hover{background:rgba(255,90,90,.1)!important}
.offCard{
  margin:0 16px 14px;padding:13px 16px;border-radius:12px;text-align:center;
  border:1px solid var(--acc);background:rgba(255,180,84,.07);
}
.offCard b{color:var(--acc);font-size:17px}
.offCard div{font-size:11px;color:var(--dim);margin-top:3px}
.novaHint{font-size:11px;color:var(--dim);text-align:center;padding:0 16px 12px;line-height:1.6}

/* ── 破环三选一(非阻塞选牌) ───────────── */
#draft{
  position:fixed;bottom:18px;left:50%;transform:translate(-50%,140%);z-index:18;
  background:var(--ink);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;
  transition:transform .45s cubic-bezier(.22,1,.36,1);max-width:94vw;
}
#draft.show{transform:translate(-50%,0)}
body.bare #draft{display:none}
.dTitle{
  font-size:10px;letter-spacing:.3em;color:var(--dim);text-align:center;margin-bottom:9px;
}
.dTitle b{color:var(--acc)}
.dRow{display:flex;gap:8px}
.dCard{
  width:138px;padding:10px 11px;border-radius:10px;cursor:pointer;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-family:inherit;color:var(--tx);
  transition:border-color .2s,background .2s,transform .15s;
}
.dCard:hover{border-color:var(--acc);background:rgba(255,180,84,.08);transform:translateY(-3px)}
.dCard .di{font-size:19px;color:var(--acc)}
.dCard .dn{font-size:13px;color:#eef3ff;margin:3px 0 2px}
.dCard .dd{font-size:10.5px;color:var(--dim);line-height:1.4}
.dCard .dk{font-size:9px;color:var(--dim);margin-top:6px;letter-spacing:.15em}

/* ── 🎰 LUCKY SPIN(柏青哥风老虎机) ──────── */
#slot{
  position:fixed;top:12vh;left:50%;z-index:26;
  transform:translateX(-50%) translateY(-40vh) scale(.5);opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s;
}
#slot.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.slotCard{
  position:relative;padding:13px 18px 12px;border-radius:18px;
  background:linear-gradient(160deg,#221035,#0a0a18 55%,#231022);
  border:2px solid #ffd76a;
  box-shadow:0 0 34px rgba(255,200,80,.4),inset 0 0 26px rgba(255,150,60,.1);
}
.slotCard.reach{
  border-color:#ff5a7a;
  box-shadow:0 0 50px rgba(255,80,120,.65),inset 0 0 30px rgba(255,80,120,.15);
}
.slotCard.win{animation:winGlow .35s infinite alternate}
@keyframes winGlow{
  from{box-shadow:0 0 36px rgba(255,215,106,.7);filter:hue-rotate(0deg)}
  to{box-shadow:0 0 70px rgba(255,110,190,.9);filter:hue-rotate(50deg)}
}
.slotCard.shake{animation:cardShake .16s}
@keyframes cardShake{
  0%,100%{translate:0 0}25%{translate:-5px 2px}50%{translate:5px -2px}75%{translate:-3px 1px}
}
.slotLights{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.slotLights i{
  width:7px;height:7px;border-radius:50%;background:#ffd76a;color:#ffd76a;
  animation:blink .7s infinite;
}
.slotLights i:nth-child(odd){animation-delay:.35s}
.reach .slotLights i{animation-duration:.22s;background:#ff5a7a;color:#ff5a7a}
.win .slotLights i{animation-duration:.14s}
@keyframes blink{0%,40%{opacity:1;box-shadow:0 0 9px currentColor}60%,100%{opacity:.12;box-shadow:none}}
.slotTitle{
  text-align:center;font-size:11px;letter-spacing:.42em;text-indent:.42em;
  color:#ffd76a;margin-bottom:10px;font-weight:700;
}
.slotTitle b{color:#ff9d5a}
.slotReels{display:flex;gap:10px;justify-content:center}
.reel{
  width:76px;height:88px;overflow:hidden;border-radius:10px;position:relative;
  background:#05060d;border:1px solid rgba(255,215,106,.35);cursor:pointer;
}
.reel::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:10px;
  background:linear-gradient(#05060d,transparent 32%,transparent 68%,#05060d);
}
.reelStrip{will-change:transform}
.reelStrip div{height:88px;display:grid;place-items:center;font-size:42px;color:#f2f6ff;font-weight:700}
.reel.spin .reelStrip{filter:blur(2px)}
.reel.stopped{border-color:#ffd76a;box-shadow:0 0 16px rgba(255,215,106,.5),inset 0 0 12px rgba(255,215,106,.18)}
.slotMsg{margin-top:10px;text-align:center;font-size:12.5px;color:var(--tx);min-height:17px;letter-spacing:.04em}
.slotMsg b{color:#ffd76a}

/* ── 小屏适配 ───────────────────────────── */
@media (max-width:600px){
  .dRow{flex-wrap:wrap;justify-content:center}
  .dCard{width:calc(33.3% - 6px);min-width:96px;padding:8px 9px}
  .dCard .dk{display:none}
  .keysHint{display:none}
  .menuWrap .mark{font-size:clamp(38px,13vw,68px)}
  .menuCard{max-height:58vh}
  #tuner{width:min(94vw,304px)}
  #tunerTab{top:8px;right:8px}
  .reel{width:60px;height:72px}
  .reelStrip div{height:72px;font-size:32px}
}

/* ── 弹出层 / Toast ─────────────────────── */
.pop{
  position:fixed;inset:0;z-index:40;display:none;place-items:center;
  background:rgba(2,4,10,.55);
}
.pop.show{display:grid}
.popCard{
  width:min(430px,90vw);background:var(--ink);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:14px;padding:16px;
}
.popTitle{font-size:12px;letter-spacing:.24em;color:var(--dim);margin-bottom:10px}
#impText{
  width:100%;height:130px;resize:none;background:#070b16;color:var(--tx);
  border:1px solid var(--line);border-radius:8px;padding:10px;
  font:12px/1.5 Consolas,monospace;outline:none;user-select:text;
}
#impText:focus{border-color:var(--acc)}
.popBtns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.popBtns .btn{padding:7px 18px}
#toast{
  position:fixed;bottom:30px;left:50%;transform:translate(-50%,16px);z-index:50;
  padding:9px 22px;border-radius:10px;background:var(--ink);backdrop-filter:blur(12px);
  border:1px solid var(--line);color:var(--tx);font-size:12.5px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s cubic-bezier(.22,1,.36,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="menu">
  <div class="menuWrap">
    <div class="mark">BALLRU</div>
    <div class="markSub">ORBITAL SHATTER · 环爆模拟</div>
    <div class="dustBar"><span class="du">✦ <b id="mDust">0</b> 星尘</span><span class="co">◉ <b id="mCores">0</b> 核心</span></div>
    <div class="menuCard">
      <div id="offSlot"></div>
      <div class="menuNav menuPage on" id="pageHome"></div>
      <div class="menuPage" id="pageShop">
        <div class="pageHead"><b>✦ 升级商店</b><button class="backBtn" data-back>← 返回</button></div>
        <div class="pageBody" id="shopBody"></div>
      </div>
      <div class="menuPage" id="pageSet">
        <div class="pageHead"><b>设置</b><button class="backBtn" data-back>← 返回</button></div>
        <div class="pageBody" id="setBody"></div>
      </div>
      <div class="menuPage" id="pageStats">
        <div class="pageHead"><b>统计</b><button class="backBtn" data-back>← 返回</button></div>
        <div class="pageBody" id="statsBody"></div>
      </div>
      <div class="menuPage" id="pageSave">
        <div class="pageHead"><b>存档管理</b><button class="backBtn" data-back>← 返回</button></div>
        <div class="pageBody" id="saveBody"></div>
      </div>
    </div>
  </div>

const SAVE_KEY = 'ballru.save.v2';
const SET_KEYS = ['volume', 'scaleName', 'shakeAmp', 'clickPulse', 'hud', 'autoQuality', 'floaters', 'ambient', 'melody', 'customMelody', 'hitbox', 'slotChance', 'bossEvery', 'pityN'];

function saveGame() {
  if (suppressSave) return;
  try {
    const set = {}; SET_KEYS.forEach(k => set[k] = P[k]);
    set.flashOn = flashOn;
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, meta, set,
      run: started ? { seed, ringsBroken: world.ringsBroken, score: Math.round(world.score), destroyed: world.destroyed, balls: world.balls.length } : (lastRun || null),
      lastSeen: Date.now(),
    }));

  } catch (e) {}
}
let lastRun = null; // 读档得到的局快照
function loadGame() {
  let offline = 0, offHours = 0;
  try {
    const j = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!j || j.v !== 2) return { offline, offHours };
    if (j.meta) {
      meta.dust = +j.meta.dust || 0; meta.cores = +j.meta.cores || 0; meta.totalDust = +j.meta.totalDust || 0;
      meta.dustRate = +j.meta.dustRate || 0;
      Object.keys(meta.skills).forEach(k => meta.skills[k] = Math.max(0, Math.min(5, (j.meta.skills || {})[k] | 0)));
      Object.keys(meta.ups).forEach(k => { const d = UPS.find(u => u.k === k); meta.ups[k] = Math.max(0, Math.min(d ? d.max : 5, (j.meta.ups || {})[k] | 0)); });
      Object.keys(meta.coreUps).forEach(k => { const d = CORE_UPS.find(u => u.k === k); meta.coreUps[k] = Math.max(0, Math.min(d ? d.max : 10, (j.meta.coreUps || {})[k] | 0)); });
      Object.assign(meta.counters, j.meta.counters || {});
      Object.assign(meta.ach, j.meta.ach || {});
      meta.slotPity = +j.meta.slotPity || 0;
      Object.assign(meta.stats, j.meta.stats || {});
    }
    if (j.set) {
      SET_KEYS.forEach(k => { if (k in j.set) P[k] = j.set[k]; });
      if ('flashOn' in j.set) flashOn = !!j.set.flashOn;
    }
    if (j.run && j.run.ringsBroken > 0) lastRun = j.run;
    if (j.lastSeen && meta.dustRate > 0) {
      const sec = Math.min((Date.now() - j.lastSeen) / 1000, (8 + meta.coreUps.offCap * 4) * 3600);
      if (sec > 90) {
        offline = Math.round(meta.dustRate * sec * (0.3 + meta.ups.offline * 0.14) * dustMult());
        offHours = sec / 3600;
      }
    }
  } catch (e) {}

}

  const notes = [];
  for (const tok of String(str || '').trim().split(/\s+/)) {
    const m = /^(#?)([1-7])([+-]*)$/.exec(tok);
    if (!m) continue;

/* ── 物理 ──────────────────────────────── */
function jitterDir(b) {
  if (P.bounceJitter <= 0) return;
  const a = (rng() - .5) * 2 * P.bounceJitter;
  const c = Math.cos(a), s = Math.sin(a);
  const vx = b.vx * c - b.vy * s, vy = b.vx * s + b.vy * c;
  b.vx = vx; b.vy = vy;
}
function nearestAlive(ring, ang, maxOff) {
  const n = ring.n;
  let ci = Math.round(((ang % TAU) + TAU) % TAU / (TAU / n)) % n;
  for (let off = 0; off <= maxOff; off++) {
    let i = (ci + off) % n;
    if (ring.pellets[i].alive) return i;
    i = ((ci - off) % n + n) % n;
    if (ring.pellets[i].alive) return i;
  }
  return -1;
}
/* 径向反弹(墙在半径 R 处,球可能在内侧或外侧) */
function radialBounce(b, R, pr, d) {
  const side = d < R ? -1 : 1; // 法线指向球所在一侧
  const nx = side * b.x / d, ny = side * b.y / d;
  const dot = b.vx * nx + b.vy * ny;
  if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; jitterDir(b); }
  const dd = side < 0 ? R - pr - b.r - 1 : R + pr + b.r + 1;
  b.x *= dd / d; b.y *= dd / d;
}
/* 球穿缺口逃逸的奖励(钻空子 = 爽感来源,要大方) */
function rewardEscape(b, ring) {

/* solid 模式单环碰撞:对最近存活粒子做"精确弧距"判定 ——
 * 距离 > (球r+粒r)×碰撞体积% 即视为缺口穿过(P.hitbox 越小越容易钻空子) */
function collideSolidRing(b, ring, d) {
  const reach = (b.r + ring.pr) * P.hitbox;
  if (Math.abs(d - ring.R) > reach) return false;
  // 相位跃迁:概率瞬移到环对侧(速度不变,镜像后自然反向穿行)

    b.x = -b.x; b.y = -b.y;
    spawnSparks(b.x, b.y, 200, 6, 320);
    spawnWave(b.x, b.y, 200, 4, 50, 3, .3);
    audio.blip(1320, .14, .12, panOf(b.x), 'sine', 'triangle');
    return true;
  }
  const ang = Math.atan2(b.y, b.x);
  const spacing = ring.R * TAU / ring.n;
  const win = Math.ceil(reach / spacing) + 2;
  const ki = nearestAlive(ring, ang, win);
  if (ki >= 0) {
    const p = ring.pellets[ki];
    let dAng = Math.abs(ang - p.ang) % TAU;
    if (dAng > Math.PI) dAng = TAU - dAng;

function collideArcRing(b, ring, d) {

    const pad = reach / g[2];
    let rel = Math.atan2(b.y, b.x) - g[0];
    rel = ((rel % TAU) + TAU) % TAU;

function collideBall(b) {

  for (const ring of world.rings) {
    if (ring.broken) continue;
    if (Math.abs(d - ring.R) > b.r + (ring.band || ring.pr * 1.3) + 4) continue;
    if (ring.kind === 'arc') { if (collideArcRing(b, ring, d)) return; continue; }
    if (P.wallMode === 'solid') { if (collideSolidRing(b, ring, d)) return; continue; }

    const dAng = TAU / ring.n;

    const span = Math.ceil((b.r + ring.pr * 1.2) / (ring.R * dAng)) + 1;

      const dx = b.x - p.x, dy = b.y - p.y, rr = (b.r + p.r) * P.hitbox;

}
function ballBall() {
  const bs = world.balls;
  for (let i = 0; i < bs.length; i++) {

      const a = bs[i], c = bs[j];

      const dvn = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
      if (dvn > 0) {

        c.vx += dvn * nx; c.vy += dvn * ny;

      const push = (rr - d) / 2 + .5;
      a.x -= nx * push; a.y -= ny * push;
      c.x += nx * push; c.y += ny * push;
      spawnSparks((a.x + c.x) / 2, (a.y + c.y) / 2, a.hue, 5, 260);
      addTrauma(.02 * P.shakeAmp);

  }
}

/* ── 镜头 ──────────────────────────────── */
function camera(rdt) {
  const act = getActive();
  world.act = act;
  let contain = world.rings[act] ? world.rings[act].R : P.baseRadius;
  // 包含所有球的最小外环(两种模式都可能穿缺口游走到外环)
  let minContainIdx = Infinity;
  for (const b of world.balls) {
    const d = Math.hypot(b.x, b.y) + b.r;
    let idx = world.rings.length;
    for (const ring of world.rings) {
      if (!ring.broken && ring.R - ring.pr > d) {
        if (ring.R > contain) contain = ring.R;
        idx = ring.idx;
        break;
      }
    }
    if (idx < minContainIdx) minContainIdx = idx;
  }
  // 逃逸即坍缩:全部球都越过的内环在身后爆碎(进度不因穿洞而卡死)
  if (started && world.balls.length && minContainIdx !== Infinity) {
    const first = world.rings[act];
    if (first && !first.broken && first.idx < minContainIdx) shatterRing(first); // 每帧最多一环,错开演出
  }
  let zT = Math.min(W, H) / 2 / ((contain + P.pelletSize * 2.5) * P.camPad);
  if (!started) zT *= 1 + .025 * Math.sin(idleT * .6); // 待机呼吸
  cam.z += (zT - cam.z) * (1 - Math.exp(-P.zoomSmooth * rdt));
  // 镜头拉远后按需补生成外环(每帧最多 8 个,均摊建造成本)
  const need = Math.hypot(W, H) / (2 * cam.z) + P.ringGap * 2;
  let guard = 0;
  while (world.rings.length && world.rings[world.rings.length - 1].R < need && guard++ < 8) {
    world.rings.push(makeRing(world.rings.length));
  }
  trauma = Math.max(0, trauma - rdt * 1.4);
  const s2 = trauma * trauma, t = nowSec;
  const amp = 26 * P.shakeAmp * RM * s2;
  shakeX = amp * (Math.sin(t * 38.1) * .6 + Math.sin(t * 17.3) * .4);
  shakeY = amp * (Math.cos(t * 31.7) * .6 + Math.cos(t * 19.9) * .4);
  shakeRot = .05 * P.shakeAmp * RM * s2 * (Math.sin(t * 29.3) * .7 + Math.sin(t * 13.1) * .3);
}

      c.fillText(`☀ 超新星就绪 +${ng} ◉(ESC 菜单)`, 18, 112);
    }
    // 限时增益(右上)
    c.textAlign = 'right';
    let by = 18;
    for (const b of buffsActive) {
      c.fillStyle = `hsla(45,100%,70%,${b.t < 3 ? .4 + .6 * Math.abs(Math.sin(nowSec * 6)) : .95})`;
      c.font = '700 13px Bahnschrift, "Arial Narrow", sans-serif';
      c.fillText(`${b.icon} ${b.name} ×${b.x} · ${Math.ceil(b.t)}s`, W - 14, by);
      by += 20;
    }
    c.textAlign = 'left';
    // 右下角状态
    c.textAlign = 'right';
    c.fillStyle = 'rgba(94,107,140,.75)';
    c.font = '600 10px Bahnschrift, "Arial Narrow", sans-serif';
    const fps = Math.round(1000 / Math.max(emaMs, 1));
    c.fillText(`Q${quality} · ${fps} FPS · SEED ${seed}`, W - 14, H - 22);
  }
  // COMBO(录屏模式保留 —— 它就是节目效果)
  if (P.hud && world.combo >= 5) {
    const pop = world.comboPop;
    const hue = (48 - Math.min(world.combo * 1.2, 160) + 360) % 360;
    c.textAlign = 'center';
    const fs = Math.round(40 + pop * 18);
    c.font = `700 ${fs}px Bahnschrift, "Arial Narrow", sans-serif`;
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = .45;
    c.fillStyle = `hsl(${hue},100%,60%)`;
    c.fillText(`×${world.combo}`, W / 2, 30);
    c.globalAlpha = 1;
    c.fillStyle = `hsl(${hue},100%,78%)`;
    c.fillText(`×${world.combo}`, W / 2, 30);
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = 'rgba(94,107,140,.9)';
    c.font = '700 10px Bahnschrift, "Arial Narrow", sans-serif';
    try { c.letterSpacing = '0.4em'; } catch (e) {}
    c.fillText('COMBO', W / 2 + 4, 34 + fs);
    try { c.letterSpacing = '0em'; } catch (e) {}
  }
  // 中央横幅
  if (P.hud) {
    c.textAlign = 'center';
    let bi = 0;
    for (const b of world.banners) {
      const k = b.t / b.life;
      const sc = 1 + (1 - easeOutQuint(Math.min(1, k * 3))) * 1.2;
      const alpha = k < .7 ? 1 : 1 - (k - .7) / .3;
      const y = H * .3 + bi * 56;
      const fs = Math.round(34 * sc);
      c.font = `700 ${fs}px Bahnschrift, "Arial Narrow", sans-serif`;
      try { c.letterSpacing = '0.18em'; } catch (e) {}
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = alpha * .55;
      c.fillStyle = `hsl(${b.hue},95%,62%)`;
      c.fillText(b.text, W / 2, y);
      c.globalAlpha = alpha;
      c.fillStyle = '#f4f7ff';
      c.fillText(b.text, W / 2, y);
      c.globalCompositeOperation = 'source-over';
      if (b.sub) {
        c.globalAlpha = alpha * .8;
        c.font = '600 13px Bahnschrift, "Arial Narrow", sans-serif';
        c.fillStyle = `hsl(${b.hue},80%,72%)`;
        c.fillText(b.sub, W / 2, y + fs + 8);
      }
      try { c.letterSpacing = '0em'; } catch (e) {}
      c.globalAlpha = 1;
      bi++;
    }
  }
  if (paused) {
    c.textAlign = 'center';
    c.fillStyle = 'rgba(242,246,255,.92)';
    c.font = '700 26px Bahnschrift, "Arial Narrow", sans-serif';
    try { c.letterSpacing = '0.3em'; } catch (e) {}
    c.fillText('⏸ PAUSED', W / 2, H * .46);
    try { c.letterSpacing = '0em'; } catch (e) {}
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgC, 0, 0);
  drawWorldLayer(ctx, dpr);
  // Bloom:低分辨率发光层放大叠加
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (P.bloom > 0 && quality > 0) {
    g1x.setTransform(1, 0, 0, 1, 0, 0);
    g1x.globalCompositeOperation = 'source-over';
    g1x.clearRect(0, 0, glow1.width, glow1.height);
    drawWorldLayer(g1x, dpr / 3);
    g1x.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = clamp(P.bloom * .75, 0, 1);
    ctx.drawImage(glow1, 0, 0, cv.width, cv.height);
    if (quality > 1) {
      g2x.setTransform(1, 0, 0, 1, 0, 0);
      g2x.clearRect(0, 0, glow2.width, glow2.height);
      g2x.drawImage(glow1, 0, 0, glow2.width, glow2.height);
      ctx.globalAlpha = clamp(P.bloom * .5, 0, 1);
      ctx.drawImage(glow2, 0, 0, cv.width, cv.height);
    }
    ctx.globalAlpha = 1;
  }
  // 暗角 + 闪光
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vigC, 0, 0);
  if (vigPulse > .01) {
    ctx.globalAlpha = Math.min(vigPulse, .5);
    ctx.drawImage(vigC, 0, 0);
    ctx.globalAlpha = 1;
  }
  if (flash > .004 && flashOn) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(190,210,255,${Math.min(flash * RM, .85)})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 屏幕空间 HUD
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHUD(ctx);
  // 牵引准星(按住时):向心收拢的旋转虚线圈
  if (pointer.held && started && !paused && !uiHidden) {
    const k = (nowSec * 1.7) % 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'hsl(40,95%,70%)';
    ctx.lineWidth = 1.6;
    for (let ring = 0; ring < 2; ring++) {
      const rr2 = lerp(34, 8, (k + ring * .5) % 1);
      ctx.globalAlpha = .8 * (1 - (k + ring * .5) % 1);
      ctx.setLineDash([5, 7]);
      ctx.lineDashOffset = -nowSec * 60;
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, rr2, 0, TAU); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'hsl(40,100%,80%)';
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 2.5, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ── 调参控制台(schema 驱动) ─────────── */
const fmtVal = (s, v) => {
  if (s.type === 'toggle') return v ? 'ON' : 'OFF';
  if (s.type === 'select') { const o = s.opts.find(o => o[0] === v); return o ? o[1] : v; }
  const dec = s.step >= 1 ? 0 : s.step >= .1 ? 1 : 2;
  return (+v).toFixed(dec);
};
const CHANGE_FX = {
  volume: v => audio.setVolume(v),
  wet: v => audio.setWet(v),
  ambient: v => audio.setAmbient(v),
  recolor: () => recolorRings(),
  stars: () => buildStars(),
  melody: () => rebuildMelody(),
};
const ctrlRefs = {};
function applyParam(s, v) {
  P[s.k] = v;
  if (s.change && CHANGE_FX[s.change]) CHANGE_FX[s.change](v);
  if (s.rebuild) queueRebuild();
}
function buildTuner() {
  const body = $('#tBody');

    const gb = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'row' + (s.type ? ' alt' : '');

      const lab = document.createElement('span');
      lab.className = 'rLab'; lab.textContent = s.label;
      row.appendChild(lab);
      if (s.type === 'toggle') {
        const wrap = document.createElement('label');
        wrap.className = 'tog';
        const inp = document.createElement('input');
        inp.type = 'checkbox'; inp.checked = !!P[s.k];
        inp.onchange = () => applyParam(s, inp.checked);
        wrap.appendChild(inp);
        wrap.appendChild(document.createElement('i'));
        row.appendChild(wrap);
        ctrlRefs[s.k] = { set: v => { inp.checked = !!v; } };
      } else if (s.type === 'select') {
        const sel = document.createElement('select');
        s.opts.forEach(([val, txt]) => {
          const o = document.createElement('option');
          o.value = val; o.textContent = txt;
          sel.appendChild(o);
        });
        sel.value = P[s.k];
        sel.onchange = () => applyParam(s, sel.value);
        row.appendChild(sel);
        ctrlRefs[s.k] = { set: v => { sel.value = v; } };
      } else {
        const inp = document.createElement('input');
        inp.type = 'range';
        inp.min = s.min; inp.max = s.max; inp.step = s.step;
        inp.value = P[s.k];
        const val = document.createElement('span');
        val.className = 'rVal'; val.textContent = fmtVal(s, P[s.k]);
        const paint = v => {
          inp.style.setProperty('--fill', ((v - s.min) / (s.max - s.min) * 100) + '%');
          val.textContent = fmtVal(s, v);
        };
        paint(P[s.k]);
        inp.oninput = () => { const v = +inp.value; paint(v); applyParam(s, v); };
        row.appendChild(inp);
        row.appendChild(val);
        ctrlRefs[s.k] = { set: v => { inp.value = v; paint(v); } };
      }
      row.ondblclick = () => {
        applyParam(s, s.def);
        ctrlRefs[s.k].set(s.def);
        toast(`${s.label} → 默认`);
      };
      gi.appendChild(row);
    });
    grp.appendChild(head);
    grp.appendChild(gb);
    body.appendChild(grp);
  });
}

/* ── 破环三选一(非阻塞,不打断爽感) ──── */
function rollDraft() {
  const pool = DRAFTS.filter(d => !d.need || d.need());
  const opts = [], used = new Set();
  while (opts.length < 3 && used.size < pool.length) {
    const i = Math.floor(rng() * pool.length);
    if (used.has(i)) continue;
    used.add(i); opts.push(pool[i]);
  }
  activeDraft = opts;
  renderDraft();
}
function renderDraft() {
  const row = $('#dRow');
  row.innerHTML = '';
  (activeDraft || []).forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'dCard';
    b.innerHTML = `<div class="di">${d.icon}</div><div class="dn">${d.name}</div><div class="dd">${d.desc}</div><div class="dk">按 ${i + 1} 选择</div>`;
    b.onclick = () => chooseDraft(i);
    row.appendChild(b);
  });
  $('#dCount').textContent = pendingDrafts > 1 ? `(队列 ${pendingDrafts})` : '';
  $('#draft').classList.add('show');
}
function chooseDraft(i) {
  if (!activeDraft || !activeDraft[i]) return;
  const d = activeDraft[i];
  d.apply();
  toast(`${d.icon} ${d.name}:${d.desc}`);
  audio.milestone();
  spawnWave(0, 0, 48, 10, 120, 5, .4);
  pendingDrafts--;
  if (pendingDrafts > 0) rollDraft();
  else { activeDraft = null; $('#draft').classList.remove('show'); }
  saveGame();
}

/* ── 🎰 LUCKY SPIN 引擎(柏青哥式三转轮) ── */
const slotQueue = [];
let slotBusy = false, slotReels = null, slotRAF = 0, slotHeartbeat = 0;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function triggerSlot(src) {
  if (slotQueue.length >= 3) return;
  slotQueue.push(src);
  if (!slotBusy) runSlot();
  else $('#slotQ').textContent = `+${slotQueue.length}`;
}
function runSlot() {
  const src = slotQueue.shift();
  if (src == null) { $('#slot').classList.remove('show'); slotBusy = false; return; }
  slotBusy = true;
  $('#slotQ').textContent = slotQueue.length ? `+${slotQueue.length}` : '';
  const card = $('#slotCard');
  card.classList.remove('win', 'reach');
  // 结果用 gameplay RNG(保种子确定性);填充格用 Math.random(纯视觉)
  let res = [rollSymbol(), rollSymbol(), rollSymbol()];
  // 保底:连续 pityN-1 次未中三连,本转必出三连(随机符号)
  const pityHit = P.pityN > 0 && meta.slotPity >= P.pityN - 1;
  if (pityHit) { const fs = rollSymbol(); res = [fs, fs, fs]; }
  if (pityHit) {
    card.classList.add('reach');
    $('#slotMsg').innerHTML = '<b>✨ 保底触发!必出三连!</b>';
  } else {
    $('#slotMsg').textContent = P.pityN > 0
      ? `点击转轮可提前停轮 · 保底 ${Math.min(meta.slotPity + 1, P.pityN)}/${P.pityN}`
      : '点击转轮可提前停轮';
  }
  const reach = res[0].k === res[1].k;
  const LAND = 16;
  const reels = [];
  document.querySelectorAll('#slot .reel').forEach((el, i) => {
    const strip = el.querySelector('.reelStrip');
    strip.innerHTML = '';
    for (let k = 0; k <= LAND + 2; k++) {
      const div = document.createElement('div');
      div.textContent = k === LAND ? res[i].icon
        : SLOT_SYMBOLS[(Math.random() * SLOT_SYMBOLS.length) | 0].icon;
      strip.appendChild(div);
    }
    strip.style.transform = 'translateY(0)';
    el.classList.add('spin');
    el.classList.remove('stopped');
    reels.push({
      el, strip, done: false, early: null, lastCell: 0,
      start: performance.now(),
      dur: [1050, 1950, reach ? 4300 : 2750][i],
    });
  });
  const cell = reels[0].strip.children[0].offsetHeight || 88;
  slotReels = { reels, res, reach, cell, land: LAND, tickAt: 0 };
  $('#slot').classList.add('show');
  audio.resume();
  cancelAnimationFrame(slotRAF);
  slotRAF = requestAnimationFrame(slotFrame);
}
function slotFrame(now) {
  const S = slotReels;
  if (!S) return;
  const D = S.land * S.cell;
  let allDone = true;
  S.reels.forEach((r, i) => {
    if (r.done) return;
    allDone = false;
    let pos;
    if (r.early) {
      const k = Math.min(1, (now - r.early.t0) / r.early.dur);
      pos = lerp(r.early.from, D, easeOutCubic(k));
      if (k >= 1) finishReel(r, i);
    } else {
      const k = Math.min(1, (now - r.start) / r.dur);
      pos = D * easeOutCubic(k);
      if (k >= 1) finishReel(r, i);
    }
    r.strip.style.transform = `translateY(${-pos}px)`;
    const ci = Math.floor(pos / S.cell);
    if (ci !== r.lastCell) {
      r.lastCell = ci;
      if (now - S.tickAt > 45) { S.tickAt = now; audio.slotTick(); }
    }
  });
  if (!allDone) { slotRAF = requestAnimationFrame(slotFrame); return; }
  settleSlot();
}
function finishReel(r, i) {
  if (r.done) return;
  r.done = true;
  r.el.classList.remove('spin');
  r.el.classList.add('stopped');
  const card = $('#slotCard');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 170);
  audio.slotStop();
  const S = slotReels;
  // リーチ:前两轮同符号 → 第三轮拉长 + 心跳(柏青哥听牌张力)
  if (S && i === 1 && S.reach && !S.reels[2].done) {
    card.classList.add('reach');
    $('#slotMsg').innerHTML = '<b>リーチ!听牌!</b>';
    clearInterval(slotHeartbeat);
    slotHeartbeat = setInterval(() => audio.thump(0), 430);
  }
}
function settleSlot() {
  clearInterval(slotHeartbeat);
  const S = slotReels;
  slotReels = null;
  const card = $('#slotCard');
  card.classList.remove('reach');
  const [a, b, c] = S.res;
  let tier = 0, sym = a;
  if (a.k === b.k && b.k === c.k) { tier = 2; sym = a; }
  else if (a.k === b.k) { tier = 1; sym = a; }
  else if (b.k === c.k) { tier = 1; sym = b; }
  else if (a.k === c.k) { tier = 1; sym = a; }
  meta.slotPity = tier === 2 ? 0 : (meta.slotPity || 0) + 1;
  const msg = applySlotReward(sym, tier);
  $('#slotMsg').innerHTML = `<b>${msg}</b>`;
  if (tier === 2) {
    card.classList.add('win');
    flash = Math.min(flash + (sym.k === 'seven' ? .9 : .55), 1);
    vigPulse = .7;
    addTrauma((sym.k === 'seven' ? 1 : .6) * P.shakeAmp);
    if (P.slowmoTime > 0) smT = Math.max(smT, .5);
    banner(sym.k === 'seven' ? '🎰 JACKPOT 777' : `🎰 ${sym.icon} ${sym.icon} ${sym.icon} 大当たり`, msg.replace(/<[^>]*>/g, ''), 48);
    setHighlight(sym.k === 'seven' ? '🎰 JACKPOT 777' : `🎰 三连 ${sym.icon}${sym.icon}${sym.icon}`);
    audio.fanfare(true);
    spawnWave(0, 0, 48, 10, 520, 18, .8);
  } else if (tier === 1) {
    card.classList.add('win');
    addTrauma(.25 * P.shakeAmp);
    audio.fanfare(false);
  } else {
    audio.blip(330, .18, .25, 0, 'triangle', 'sine');
  }
  updateMenuCurrency();
  saveGame();
  setTimeout(() => {
    card.classList.remove('win');
    runSlot(); // 队列连转,空了自动收起
  }, tier === 2 ? 2400 : 1700);
}
// 点击转轮:最早未停的转轮 0.24s 内快速落定
document.querySelectorAll('#slot .reel').forEach(el => {
  el.addEventListener('pointerdown', () => {
    const S = slotReels;
    if (!S) return;
    const r = S.reels.find(r => !r.done && !r.early);
    if (!r) return;
    const now = performance.now();
    const k = Math.min(1, (now - r.start) / r.dur);
    r.early = { t0: now, dur: 240, from: S.land * S.cell * easeOutCubic(k) };
  });
});

/* ── 📸 战绩分享卡(1080×1350,实况画面做底) ── */
let lastHighlight = null;
function setHighlight(text) { lastHighlight = { text, t: Date.now() }; }
function drawShareCard() {
  const cw = 1080, ch = 1350;
  const cc = document.createElement('canvas');
  cc.width = cw; cc.height = ch;
  const x = cc.getContext('2d');
  x.textBaseline = 'top';
  x.fillStyle = '#05070f'; x.fillRect(0, 0, cw, ch);
  // 实况画面 cover 裁切打底
  const sr = cv.width / cv.height, tr = cw / ch;
  let sw, sh, sx0, sy0;
  if (sr > tr) { sh = cv.height; sw = sh * tr; sx0 = (cv.width - sw) / 2; sy0 = 0; }
  else { sw = cv.width; sh = sw / tr; sx0 = 0; sy0 = (cv.height - sh) / 2; }
  x.drawImage(cv, sx0, sy0, sw, sh, 0, 0, cw, ch);
  x.fillStyle = 'rgba(4,6,15,.74)'; x.fillRect(0, 0, cw, ch);
  // 装饰圆点环
  x.globalCompositeOperation = 'lighter';
  x.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    x.globalAlpha = .16;
    x.strokeStyle = `hsl(${20 + i * 45},90%,60%)`;
    x.lineWidth = 9;
    x.setLineDash([1, 26]);
    x.beginPath(); x.arc(cw / 2, ch * .47, 330 + i * 130, 0, TAU); x.stroke();
  }
  x.setLineDash([]); x.globalAlpha = 1;
  x.globalCompositeOperation = 'source-over';
  const F = (w, s) => `${w} ${s}px Bahnschrift,"Arial Narrow",sans-serif`;
  const LS = v => { try { x.letterSpacing = v; } catch (e) {} };
  x.textAlign = 'center';
  x.fillStyle = '#f2f6ff'; x.font = F(700, 116); LS('0.08em');
  x.fillText('BALLRU', cw / 2, 64);
  x.fillStyle = '#7785a8'; x.font = F(700, 24); LS('0.5em');
  x.fillText('ORBITAL SHATTER · 环爆模拟', cw / 2, 206);
  LS('0.04em');
  const hl = lastHighlight && Date.now() - lastHighlight.t < 300000 ? lastHighlight.text : '⚡ 战绩快照';
  x.fillStyle = 'hsl(48,100%,66%)'; x.font = F(700, 60);
  x.fillText(hl, cw / 2, 296);
  x.fillStyle = '#ffffff'; x.font = F(700, 132); LS('0em');
  x.fillText(Math.round(world.score).toLocaleString(), cw / 2, 396);
  x.fillStyle = '#7785a8'; x.font = F(700, 22); LS('0.4em');
  x.fillText('SCORE', cw / 2, 546);
  // 战绩网格 2×3
  const cells = [
    ['RING ' + (world.act + 1), '当前环'], ['×' + fmtN(world.bestCombo), '本局最高连击'],
    [fmtN(meta.totalDust), '累计星尘'], [fmtN(meta.cores) + ' ◉', '核心'],
    [fmtN(meta.stats.supernovas), '超新星'], [fmtN(meta.counters.escapes), '越狱'],
  ];
  cells.forEach(([v, l], i) => {
    const cx = cw * (i % 2 ? .73 : .27), cy = 660 + Math.floor(i / 2) * 160;
    x.fillStyle = '#f2f6ff'; x.font = F(700, 58); LS('0.02em');
    x.fillText(v, cx, cy);
    x.fillStyle = '#7785a8'; x.font = F(700, 20); LS('0.3em');
    x.fillText(l, cx, cy + 74);
  });
  x.fillStyle = 'hsl(48,95%,62%)'; x.font = F(700, 27); LS('0.06em');
  x.fillText(`SEED ${seed} —— 输入同一种子,挑战同一局`, cw / 2, 1170);
  x.fillStyle = '#c9d5ef'; x.font = F(700, 33); LS('0.12em');
  x.fillText('caldis.github.io/ballru', cw / 2, 1224);
  x.fillStyle = '#5e6b8c'; x.font = F(700, 20); LS('0.2em');
  const d = new Date();
  x.fillText(`${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`, cw / 2, 1284);
  LS('0em');
  return cc;
}
function shareCard() {
  drawShareCard().toBlob(async blob => {
    if (!blob) { toast('生成失败'); return; }
    const file = new File([blob], `ballru-${seed}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'BALLRU 战绩' });
        toast('已调起系统分享');
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ballru-card-${seed}-${Date.now()}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('战绩卡已保存 PNG');
  });
}

  const desc = lvl >= def.max ? def.desc(lvl) : (lvl > 0 ? `当前:${def.desc(lvl)}<br>下一级:${def.desc(lvl + 1)}` : def.desc(lvl + 1));

function mkSlider(get, set, min, max, step) {
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  const paint = () => inp.style.setProperty('--fill', ((+inp.value - min) / (max - min) * 100) + '%');
  paint();
  inp.oninput = () => { set(+inp.value); paint(); };
  return inp;
}
function mkToggle(get, set) {
  const wrap = document.createElement('label');
  wrap.className = 'tog';
  const inp = document.createElement('input');
  inp.type = 'checkbox'; inp.checked = !!get();
  inp.onchange = () => set(inp.checked);
  wrap.appendChild(inp);
  wrap.appendChild(document.createElement('i'));
  return wrap;
}

addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') {
    if (e.code === 'Escape') closePop();
    return;
  }
  switch (e.code) {
    case 'Space': e.preventDefault(); started ? togglePause() : startRun(!!lastRun); break;
    case 'Enter': if (!started) startRun(!!lastRun); break;
    case 'KeyR': if (started) { restart(seed); toast('已重开'); } break;
    case 'KeyN': if (started) { restart((Math.random() * 1e9) | 0); toast(`新种子:${seed}`); } break;
    case 'KeyC': toggleTuner(); break;
    case 'KeyH': toggleBare(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyS': keySlow = true; break;
    case 'Digit1': chooseDraft(0); break;
    case 'Digit2': chooseDraft(1); break;
    case 'Digit3': chooseDraft(2); break;
    case 'Escape':
      if ($('#impPop').classList.contains('show')) { closePop(); break; }
      if (menuOpen) { curPage !== 'home' ? showPage('home') : (started && closeMenu()); }
      else openMenu();
      break;
  }
});
addEventListener('keyup', e => { if (e.code === 'KeyS') keySlow = false; });
/* 鼠标/触控:左键(单指)短按=脉冲/引力井;按住=牵引场;右键(双指点按)=斥力爆 */
const touchIds = new Set();
cv.addEventListener('pointerdown', e => {
  if (!started || paused) return;
  audio.resume();
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (e.pointerType === 'touch') {
    touchIds.add(e.pointerId);
    if (touchIds.size >= 2) {
      // 双指点按 = 斥力爆(移动端的"右键")
      pointer.down = false; pointer.held = false;
      repulse(e.clientX, e.clientY);
      return;
    }
  }
  if (e.button === 2) { repulse(e.clientX, e.clientY); return; }
  if (e.button !== 0) return;
  pointer.down = true; pointer.downAt = performance.now(); pointer.held = false;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
addEventListener('pointerup', e => {
  touchIds.delete(e.pointerId);
  if (e.button !== 0 || !pointer.down) return;
  pointer.down = false;
  const wasHeld = pointer.held;
  pointer.held = false;
  // 短按(<180ms)→ 脉冲;长按已经施加了牵引,松开不再触发脉冲
  if (!wasHeld && started && !paused && P.clickPulse) pulse(e.clientX, e.clientY);
});
addEventListener('pointercancel', e => { touchIds.delete(e.pointerId); pointer.down = false; pointer.held = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => showPage('home'));
addEventListener('beforeunload', saveGame);
/* 修复:手机最小化网页后返回无声 —— 多重兜底唤醒 AudioContext */
function ensureAudioAlive() {
  if (!audio.ok || !audio.c) return;
  const st = audio.c.state;
  if (st === 'suspended' || st === 'interrupted') audio.c.resume().catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveGame();
  else ensureAudioAlive();
});
addEventListener('pageshow', ensureAudioAlive);   // iOS bfcache 返回
addEventListener('focus', ensureAudioAlive);
addEventListener('pointerdown', ensureAudioAlive, { capture: true }); // 返回后任意触摸兜底(满足手势要求)
$('#tHide').onclick = toggleTuner;
$('#tunerTab').onclick = toggleTuner;
$('#impApply').onclick = applyImport;
$('#impCancel').onclick = closePop;
$('#impPop').addEventListener('pointerdown', e => { if (e.target === $('#impPop')) closePop(); });
addEventListener('resize', resize);

/* ── 主循环 ────────────────────────────── */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000;
  last = now;
  rdt = Math.min(rdt, .05);
  nowSec = now / 1000;
  const ms = rdt * 1000;
  emaMs = lerp(emaMs, ms, .06);
  // 自动降质
  if (P.autoQuality) {
    if (emaMs > 19) { badT += rdt; goodT = 0; if (badT > 1.2 && quality > 0) { quality--; badT = 0; toast(`性能保护:画质降至 Q${quality}`); } }
    else if (emaMs < 12.5) { goodT += rdt; badT = 0; if (goodT > 6 && quality < 2) { quality++; goodT = 0; } }
    else { badT = 0; goodT = 0; }
  } else quality = 2;
  // 时间缩放
  let tsc = 1;
  if (smT > 0 && P.slowmoTime > 0) {
    smT -= rdt;
    const k = 1 - Math.max(smT, 0) / P.slowmoTime;
    const sm = k * k * (3 - 2 * k);
    tsc = lerp(P.slowmoScale, 1, sm);
  }
  if (keySlow) tsc = Math.min(tsc, .18);
  if (hitStopT > 0) { hitStopT -= rdt; tsc = 0; }
  // 按住超过 180ms 进入牵引模式
  if (pointer.down && !pointer.held && now - pointer.downAt > 180) pointer.held = true;
  // 超新星演出:慢镜收束后开新局
  if (novaT > 0) {
    tsc = Math.min(tsc, .22);
    novaT -= rdt;
    if (novaT <= 0) restart((Math.random() * 1e9) | 0);
  }
  if (started && !paused) {
    step(rdt * tsc);
    meta.stats.playMs += ms;
    // 星尘速率(每秒窗口 EMA,驱动离线收益)
    dustWindowT += rdt;
    if (dustWindowT >= 1) {
      meta.dustRate = lerp(meta.dustRate, dustWindow / dustWindowT, .12);
      dustWindow = 0; dustWindowT = 0;
    }
    autosaveT += rdt;
    if (autosaveT >= 10) { autosaveT = 0; saveGame(); }
  }
  if (!started) idleT += rdt;
  // 实时层(不受慢动作影响)
  world.disp += (world.score - world.disp) * Math.min(1, rdt * 7);
  world.comboPop = Math.max(0, world.comboPop - rdt * 3.2);
  flash *= Math.exp(-rdt * 6);
  vigPulse *= Math.exp(-rdt * 3);
  for (let i = world.banners.length - 1; i >= 0; i--) {
    const b = world.banners[i];
    b.t += rdt;
    if (b.t >= b.life) world.banners.splice(i, 1);
  }
  camera(rdt);
  render();
}

/* ── 启动 ──────────────────────────────── */
const off = loadGame();      // 先读档:设置/技能/离线收益都在世界构建前生效
rebuildMelody();
resize();
ensureRings();
cam.z = fitZoom();
setAccent(world.rings[0].hue);
buildTuner();
renderHome();
updateMenuCurrency();
renderOffline(off.offline, off.offHours);
// 控制台调试/测试句柄(也供高级玩家把玩)
window.BALLRU = {
  world, meta,
  get P() { return P; },
  get melody() { return { notes: melodyNotes, ptr: melodyPtr }; },
  get buffs() { return buffsActive; },
  slot: triggerSlot,
  card: drawShareCard,
  save: saveGame, restart, supernova, openMenu,
  dust(n) { meta.dust += n; meta.totalDust += n; updateMenuCurrency(); },
};
requestAnimationFrame(frame);
</script>
</body>
</html>
