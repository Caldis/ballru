<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BALLRU · 环爆模拟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ffb454' stroke-width='3' stroke-dasharray='9 4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff3e0'/%3E%3C/svg%3E">
<style>
:root{
  --acc:#ffb454;
  --ink:rgba(9,13,26,.84);
  --line:rgba(170,200,255,.10);
  --tx:#c9d5ef;
  --dim:#5e6b8c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060e}
body{
  font-family:Bahnschrift,'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
  color:var(--tx);-webkit-font-smoothing:antialiased;user-select:none;
}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

/* ── 启动遮罩 ───────────────────────────── */
#boot{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(4,7,16,.18) 0%,rgba(3,5,12,.82) 80%);
  transition:opacity .65s cubic-bezier(.22,1,.36,1),visibility .65s;
}
#boot.gone{opacity:0;visibility:hidden}
.bootInner{text-align:center;transform:translateY(-3vh)}
.mark{
  font-size:clamp(58px,13vw,134px);font-weight:700;letter-spacing:.06em;text-indent:.06em;
  color:#f2f6ff;line-height:1;
  text-shadow:0 0 34px rgba(120,160,255,.38),3px 0 0 rgba(255,92,58,.5),-3px 0 0 rgba(64,164,255,.5);
}
.markSub{margin-top:14px;font-size:13px;letter-spacing:.54em;text-indent:.54em;color:var(--dim)}
.startRing{
  margin:7vh auto 0;width:110px;height:110px;border-radius:50%;
  border:1px solid var(--acc);display:grid;place-items:center;position:relative;
  color:var(--acc);font-size:15px;letter-spacing:.34em;text-indent:.34em;
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s;
}
.startRing::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:1px dashed rgba(255,180,84,.42);animation:spin 16s linear infinite;
}
#boot:hover .startRing{transform:scale(1.06);box-shadow:0 0 38px rgba(255,180,84,.28)}
@keyframes spin{to{transform:rotate(360deg)}}
.keysHint{
  position:absolute;bottom:26px;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px 18px;
  justify-content:center;font-size:11.5px;color:var(--dim);letter-spacing:.08em;padding:0 16px;
}
kbd{
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:1px 6px;font:inherit;color:var(--tx);background:rgba(255,255,255,.045);
}

/* ── 调参控制台 ─────────────────────────── */
#tuner{
  position:fixed;top:12px;right:12px;bottom:12px;width:min(304px,86vw);z-index:20;
  display:flex;flex-direction:column;
  background:var(--ink);
  backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .35s;
}
body.tunerAway #tuner{transform:translateX(calc(100% + 26px))}
body.bare #tuner,body.bare #tunerTab{opacity:0;pointer-events:none}
#tunerTab{
  position:fixed;top:12px;right:12px;z-index:19;
  padding:7px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);backdrop-filter:blur(12px);color:var(--dim);
  font:700 11px/1 inherit;font-family:inherit;letter-spacing:.22em;text-indent:.22em;
  cursor:pointer;transition:color .2s,border-color .2s,opacity .35s;
}
#tunerTab:hover{color:var(--acc);border-color:var(--acc)}
.tHead{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.tDot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:background .6s,box-shadow .6s}
.tTitle{font-size:14px;letter-spacing:.24em;font-weight:700;color:#e8eefc;flex:1}
.tHide{
  border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px;
  font-family:inherit;padding:2px 6px;transition:color .2s;
}
.tHide:hover{color:var(--acc)}
.tBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0 10px;scrollbar-width:thin;scrollbar-color:rgba(140,170,230,.22) transparent}
.tBody::-webkit-scrollbar{width:5px}
.tBody::-webkit-scrollbar-thumb{background:rgba(140,170,230,.22);border-radius:3px}
.tFoot{flex:none;padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);letter-spacing:.05em;line-height:1.7}

.presetRow{display:flex;gap:6px;padding:12px 14px 4px;flex-wrap:wrap}
.chip{
  flex:1;min-width:62px;padding:7px 4px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);
  font-family:inherit;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;
  transition:border-color .2s,color .2s,background .2s;
}
.chip:hover{border-color:var(--acc);color:var(--acc);background:rgba(255,180,84,.06)}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 14px 12px}
.btn{
  padding:8px 6px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--tx);
  font-family:inherit;font-size:12px;letter-spacing:.08em;
  transition:border-color .2s,color .2s,background .2s;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.acc{border-color:var(--acc);color:var(--acc)}
.btn.acc:hover{background:rgba(255,180,84,.12)}

.grp{border-bottom:1px solid rgba(170,200,255,.05)}
.grpHead{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px 9px;cursor:pointer;
  font-size:10.5px;letter-spacing:.26em;color:var(--dim);
  transition:color .2s;
}
.grpHead:hover{color:var(--tx)}
.grpHead .car{transition:transform .3s;font-size:8px;color:var(--acc)}
.grp.closed .car{transform:rotate(-90deg)}
.grpBody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.22,1,.36,1)}
.grp.closed .grpBody{grid-template-rows:0fr}
.grpIn{overflow:hidden;min-height:0}

.row{display:grid;grid-template-columns:88px 1fr 50px;align-items:center;gap:8px;padding:4px 16px;cursor:default}
.row:hover{background:rgba(255,255,255,.025)}
.row.alt{grid-template-columns:1fr auto}
.rLab{font-size:12px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rVal{font-size:12px;color:var(--acc);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:20px;
  background:transparent;cursor:ew-resize;--fill:50%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;border-radius:1px;
  background:linear-gradient(var(--acc),var(--acc)) 0/var(--fill) 100% no-repeat,rgba(160,190,255,.16);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;margin-top:-4px;
  background:#0b1020;border:1.5px solid var(--acc);border-radius:2px;
  box-shadow:0 0 8px rgba(255,180,84,.45);
}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:rgba(160,190,255,.16)}
input[type=range]::-moz-range-progress{height:2px;border-radius:1px;background:var(--acc)}
input[type=range]::-moz-range-thumb{
  width:9px;height:9px;background:#0b1020;border:1.5px solid var(--acc);border-radius:2px;
}

.tog{position:relative;width:32px;height:17px;cursor:pointer;justify-self:end}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog i{
  position:absolute;inset:0;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);transition:background .2s,border-color .2s;
}
.tog i::after{
  content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:3px;
  background:var(--dim);transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s;
}
.tog input:checked + i{border-color:var(--acc);background:rgba(255,180,84,.13)}
.tog input:checked + i::after{transform:translateX(15px);background:var(--acc)}

select{
  background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:6px;
  font-family:inherit;font-size:11.5px;padding:4px 6px;cursor:pointer;outline:none;
  justify-self:end;max-width:130px;
}
select:focus{border-color:var(--acc)}

/* ── 弹出层 / Toast ─────────────────────── */
.pop{
  position:fixed;inset:0;z-index:40;display:none;place-items:center;
  background:rgba(2,4,10,.55);
}
.pop.show{display:grid}
.popCard{
  width:min(430px,90vw);background:var(--ink);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:14px;padding:16px;
}
.popTitle{font-size:12px;letter-spacing:.24em;color:var(--dim);margin-bottom:10px}
#impText{
  width:100%;height:130px;resize:none;background:#070b16;color:var(--tx);
  border:1px solid var(--line);border-radius:8px;padding:10px;
  font:12px/1.5 Consolas,monospace;outline:none;user-select:text;
}
#impText:focus{border-color:var(--acc)}
.popBtns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.popBtns .btn{padding:7px 18px}
#toast{
  position:fixed;bottom:30px;left:50%;transform:translate(-50%,16px);z-index:50;
  padding:9px 22px;border-radius:10px;background:var(--ink);backdrop-filter:blur(12px);
  border:1px solid var(--line);color:var(--tx);font-size:12.5px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s cubic-bezier(.22,1,.36,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="boot">
  <div class="bootInner">
    <div class="mark">BALLRU</div>
    <div class="markSub">ORBITAL SHATTER · 环爆模拟</div>
    <div class="startRing"><span>进入</span></div>
  </div>
  <div class="keysHint">
    <span><kbd>空格</kbd> 暂停</span><span><kbd>R</kbd> 重开</span><span><kbd>C</kbd> 控制台</span>
    <span><kbd>H</kbd> 录屏模式</span><span><kbd>S</kbd> 按住慢放</span><span><kbd>M</kbd> 静音</span>
    <span>点击画面 → 冲击脉冲</span>
  </div>
</div>

<button id="tunerTab" title="打开调参控制台 (C)">TUNER</button>
<aside id="tuner">
  <div class="tHead">
    <span class="tDot"></span>
    <span class="tTitle">BALLRU TUNER</span>
    <button class="tHide" id="tHide" title="收起 (C)">—</button>
  </div>
  <div class="tBody" id="tBody"></div>
  <div class="tFoot">双击参数行 = 恢复默认 · H = 隐藏全部 UI(录屏)<br>带 ◆ 的参数修改后自动重建世界(保留进度)</div>
</aside>

<div class="pop" id="impPop">
  <div class="popCard">
    <div class="popTitle" id="popTitle">导入参数 JSON</div>
    <textarea id="impText" spellcheck="false"></textarea>
    <div class="popBtns">
      <button class="btn" id="impCancel">取消</button>
      <button class="btn acc" id="impApply">应用并重开</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
 * BALLRU · 环爆模拟
 * 零依赖单文件:Canvas 2D 渲染 + Web Audio 全合成音频
 * ============================================================ */

/* ── 工具 ──────────────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(s) {
  let a = s >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.35 : 1; // 弱化震屏/闪光

/* ── 参数 Schema(控制台由此自动生成) ──── */
const SCHEMA = [
  // 物理
  { k: 'ballSpeed',    g: '物理', label: '基础球速',   min: 120,  max: 2200, step: 10,   def: 620 },
  { k: 'speedGain',    g: '物理', label: '破环增速%',  min: 0,    max: 30,   step: 1,    def: 7 },
  { k: 'ballRadius',   g: '物理', label: '主球半径',   min: 5,    max: 30,   step: 1,    def: 11 },
  { k: 'bounceJitter', g: '物理', label: '反弹散射',   min: 0,    max: 0.6,  step: 0.01, def: 0.12 },
  { k: 'gravity',      g: '物理', label: '重力',       min: -600, max: 1500, step: 25,   def: 0 },
  { k: 'wallMode',     g: '物理', label: '碰撞模式',   type: 'select', opts: [['solid','实墙弹射'],['pellet','粒子穿击']], def: 'solid' },
  { k: 'maxBalls',     g: '物理', label: '球数上限',   min: 1,    max: 12,   step: 1,    def: 4 },
  { k: 'splitEvery',   g: '物理', label: '分裂周期/环', min: 0,   max: 5,    step: 1,    def: 2 },
  // 世界
  { k: 'baseRadius',    g: '世界', label: '首环半径◆',  min: 90,   max: 420, step: 5,    def: 175, rebuild: true },
  { k: 'ringGap',       g: '世界', label: '环间距◆',    min: 40,   max: 280, step: 5,    def: 100, rebuild: true },
  { k: 'pelletSize',    g: '世界', label: '粒子半径◆',  min: 2.5,  max: 18,  step: 0.5,  def: 7,   rebuild: true },
  { k: 'pelletSpacing', g: '世界', label: '粒子间距◆',  min: 1.05, max: 4,   step: 0.05, def: 1.5, rebuild: true },
  { k: 'shatterAt',     g: '世界', label: '碎裂阈值%',  min: 5,    max: 95,  step: 1,    def: 30 },
  { k: 'hueBase',       g: '世界', label: '起始色相',   min: 0,    max: 360, step: 1,    def: 16,  change: 'recolor' },
  { k: 'hueStep',       g: '世界', label: '色相步进',   min: 0,    max: 120, step: 1,    def: 26,  change: 'recolor' },
  // 镜头
  { k: 'camPad',      g: '镜头', label: '取景留白',    min: 1,    max: 2,   step: 0.01, def: 1.16 },
  { k: 'zoomSmooth',  g: '镜头', label: '缩放跟随',    min: 0.5,  max: 8,   step: 0.1,  def: 2.4 },
  { k: 'shakeAmp',    g: '镜头', label: '震屏强度',    min: 0,    max: 3,   step: 0.05, def: 1 },
  { k: 'slowmoScale', g: '镜头', label: '慢动作倍率',  min: 0.03, max: 0.8, step: 0.01, def: 0.14 },
  { k: 'slowmoTime',  g: '镜头', label: '慢动作时长s', min: 0,    max: 2,   step: 0.05, def: 0.6 },
  { k: 'hitStopMs',   g: '镜头', label: '里程碑顿帧ms', min: 0,   max: 120, step: 5,    def: 60 },
  // 视觉
  { k: 'glow',        g: '视觉', label: '光晕强度',    min: 0, max: 3,   step: 0.05, def: 1.1 },
  { k: 'bloom',       g: '视觉', label: '辉光 Bloom',  min: 0, max: 1.5, step: 0.05, def: 0.8 },
  { k: 'trailLen',    g: '视觉', label: '主球拖尾',    min: 0, max: 90,  step: 1,    def: 36 },
  { k: 'sparks',      g: '视觉', label: '火花数量',    min: 0, max: 40,  step: 1,    def: 14 },
  { k: 'starDensity', g: '视觉', label: '星空密度',    min: 0, max: 400, step: 10,   def: 170, change: 'stars' },
  { k: 'floaters',    g: '视觉', label: '漂浮分数',    type: 'toggle', def: true },
  { k: 'hud',         g: '视觉', label: '战况 HUD',    type: 'toggle', def: true },
  // 音频
  { k: 'volume',    g: '音频', label: '主音量',     min: 0,    max: 1,   step: 0.01, def: 0.7, change: 'volume' },
  { k: 'scaleName', g: '音频', label: '音阶',       type: 'select', opts: [['pentatonic','五声音阶'],['major','大调'],['minor','小调'],['blues','布鲁斯'],['japan','都节(和风)']], def: 'pentatonic' },
  { k: 'noteDecay', g: '音频', label: '音符衰减s',  min: 0.05, max: 0.8, step: 0.01, def: 0.22 },
  { k: 'delayWet',  g: '音频', label: '空间回声',   min: 0,    max: 0.8, step: 0.01, def: 0.3, change: 'wet' },
  { k: 'bassVol',   g: '音频', label: '低频轰炸',   min: 0,    max: 1.5, step: 0.05, def: 0.9 },
  { k: 'ambient',   g: '音频', label: '氛围铺底',   type: 'toggle', def: true, change: 'ambient' },
  // 系统
  { k: 'clickPulse',  g: '系统', label: '点击脉冲',  type: 'toggle', def: true },
  { k: 'pulseForce',  g: '系统', label: '脉冲力度',  min: 0, max: 2000, step: 25, def: 950 },
  { k: 'autoQuality', g: '系统', label: '自动降质',  type: 'toggle', def: true },
];
const GROUP_ORDER = ['物理', '世界', '镜头', '视觉', '音频', '系统'];
const DEF = {}; SCHEMA.forEach(s => DEF[s.k] = s.def);
let P = { ...DEF };

const PRESETS = [
  { name: '🔥 默认爽', o: {} },
  { name: '🌪 混沌风暴', o: { wallMode: 'pellet', maxBalls: 10, splitEvery: 1, ballSpeed: 860, bounceJitter: 0.2, sparks: 22, shakeAmp: 1.35, hueStep: 47, shatterAt: 42, ringGap: 120, camPad: 1.22 } },
  { name: '🧘 禅模式', o: { ballSpeed: 300, speedGain: 3, maxBalls: 1, splitEvery: 0, trailLen: 84, sparks: 7, shakeAmp: 0.2, slowmoTime: 1.1, slowmoScale: 0.1, noteDecay: 0.5, delayWet: 0.55, bassVol: 0.35, hueBase: 185, hueStep: 13, bloom: 0.95, glow: 1.5, shatterAt: 18, volume: 0.6 } },
  { name: '⚡ 超频狂暴', o: { ballSpeed: 1500, speedGain: 13, maxBalls: 6, splitEvery: 2, bounceJitter: 0.16, shakeAmp: 1.9, sparks: 26, slowmoScale: 0.07, slowmoTime: 0.45, bloom: 1.05, glow: 1.3, shatterAt: 36, hitStopMs: 80, hueBase: 0, hueStep: 36 } },
];

/* ── 画布与离屏层 ──────────────────────── */
const cv = $('#view');
const ctx = cv.getContext('2d', { alpha: false });
const glow1 = document.createElement('canvas'); const g1x = glow1.getContext('2d');
const glow2 = document.createElement('canvas'); const g2x = glow2.getContext('2d');
const bgC = document.createElement('canvas');   const bgx = bgC.getContext('2d');
const vigC = document.createElement('canvas');  const vgx = vigC.getContext('2d');
let W = 0, H = 0, dpr = 1;

function resize() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  glow1.width = Math.ceil(cv.width / 3); glow1.height = Math.ceil(cv.height / 3);
  glow2.width = Math.ceil(cv.width / 9); glow2.height = Math.ceil(cv.height / 9);
  bgC.width = cv.width; bgC.height = cv.height;
  vigC.width = cv.width; vigC.height = cv.height;
  paintBg(); paintVig(); buildStars();
}
function paintBg() {
  const w = bgC.width, h = bgC.height;
  bgx.fillStyle = '#05070f'; bgx.fillRect(0, 0, w, h);
  let g = bgx.createRadialGradient(w * .5, h * .42, 0, w * .5, h * .42, Math.max(w, h) * .62);
  g.addColorStop(0, 'rgba(22,32,64,.55)'); g.addColorStop(1, 'rgba(5,7,15,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, w, h);
  g = bgx.createRadialGradient(w * .12, h * .95, 0, w * .12, h * .95, w * .55);
  g.addColorStop(0, 'rgba(120,72,20,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, w, h);
  g = bgx.createRadialGradient(w * .9, h * .08, 0, w * .9, h * .08, w * .5);
  g.addColorStop(0, 'rgba(60,48,130,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');

/* ── 音频引擎(全合成) ────────────────── */
const SCALES = {
  pentatonic: [0, 3, 5, 7, 10],
  major: [0, 2, 4, 5, 7, 9, 11],
  minor: [0, 2, 3, 5, 7, 8, 10],
  blues: [0, 3, 5, 6, 7, 10],
  japan: [0, 2, 3, 7, 8],
};
const audio = {
  ok: false, lastHit: 0, amb: null,
  init() {
    if (this.ok) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.c = new AC();
    this.master = this.c.createGain(); this.master.gain.value = P.volume;
    this.comp = this.c.createDynamicsCompressor();
    this.comp.threshold.value = -18; this.comp.knee.value = 24;
    this.comp.ratio.value = 5; this.comp.attack.value = .003; this.comp.release.value = .25;
    this.master.connect(this.comp); this.comp.connect(this.c.destination);
    this.delay = this.c.createDelay(1); this.delay.delayTime.value = .22;
    this.fb = this.c.createGain(); this.fb.gain.value = .34;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.wet = this.c.createGain(); this.wet.gain.value = P.delayWet;
    this.delay.connect(this.wet); this.wet.connect(this.master);
    const len = this.c.sampleRate | 0;
    this.noiseBuf = this.c.createBuffer(1, len, this.c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.ok = true;
    this.setAmbient(P.ambient);
  },
  resume() { this.init(); if (this.ok && this.c.state === 'suspended') this.c.resume(); },
  blip(freq, vel, decay, pan = 0, t1 = 'sine', t2 = 'triangle', when = 0) {
    if (!this.ok || vel <= 0) return;
    const t = this.c.currentTime + when;
    const g = this.c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .004);
    g.gain.exponentialRampToValueAtTime(.0008, t + Math.max(.03, decay));
    let out = g;
    if (this.c.createStereoPanner) {
      const p = this.c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
      g.connect(p); out = p;
    }
    out.connect(this.master); out.connect(this.delay);
    const o1 = this.c.createOscillator(); o1.type = t1; o1.frequency.value = freq;
    const o2 = this.c.createOscillator(); o2.type = t2; o2.frequency.value = freq * 2.003;
    const g2 = this.c.createGain(); g2.gain.value = .32;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t);
    o1.stop(t + decay + .08); o2.stop(t + decay + .08);
  },
  hit(idx, vel, pan) {
    if (!this.ok) return;
    const t = this.c.currentTime;
    if (t - this.lastHit < .022) return;
    this.lastHit = t;
    const sc = SCALES[P.scaleName] || SCALES.pentatonic;
    const L = sc.length;
    const oct = Math.floor(idx / L) % 3;
    const f = 220 * Math.pow(2, (sc[idx % L] + 12 * oct) / 12);
    this.blip(f, .22 + .5 * vel, P.noteDecay, pan);
  },
  wallTick(pan) { this.blip(150, .06, .06, pan, 'triangle', 'sine'); },
  thump(pan) {
    if (!this.ok) return;
    const t = this.c.currentTime;
    const o = this.c.createOscillator(), g = this.c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + .16);
    g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + .24);
  },
  shatter(ringIdx) {
    if (!this.ok) return;
    const t = this.c.currentTime, bv = P.bassVol;
    // sub-bass 下坠
    const o = this.c.createOscillator(), g = this.c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(34, t + .5);
    g.gain.setValueAtTime(.85 * bv, t); g.gain.exponentialRampToValueAtTime(.001, t + .7);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + .75);

    const n = this.c.createBufferSource(); n.buffer = this.noiseBuf;
    const f = this.c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(160, t + .45);
    const ng = this.c.createGain();
    ng.gain.setValueAtTime(.5 * bv, t); ng.gain.exponentialRampToValueAtTime(.001, t + .45);
    n.connect(f); f.connect(ng); ng.connect(this.master);
    n.start(t); n.stop(t + .5);
    // 上扬 sweep + 和弦
    const s = this.c.createOscillator(), sg = this.c.createGain();
    s.type = 'sawtooth';
    s.frequency.setValueAtTime(170, t); s.frequency.exponentialRampToValueAtTime(1500, t + .22);
    sg.gain.setValueAtTime(.05, t); sg.gain.exponentialRampToValueAtTime(.001, t + .25);
    s.connect(sg); sg.connect(this.master); s.start(t); s.stop(t + .3);

  },
  milestone() {
    [0, 4, 7, 12].forEach((semi, i) =>

  },
  setVolume(v) { if (this.ok) this.master.gain.linearRampToValueAtTime(v, this.c.currentTime + .06); },
  setWet(v) { if (this.ok) this.wet.gain.linearRampToValueAtTime(v, this.c.currentTime + .06); },
  setAmbient(on) {
    if (!this.ok) return;
    if (on && !this.amb) {
      const t = this.c.currentTime;
      const o1 = this.c.createOscillator(), o2 = this.c.createOscillator();
      o1.type = 'sawtooth'; o2.type = 'sawtooth';
      o1.frequency.value = 55; o2.frequency.value = 82.5; o2.detune.value = 7;
      const f = this.c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = .8;
      const lfo = this.c.createOscillator(), lg = this.c.createGain();
      lfo.frequency.value = .07; lg.gain.value = 160;
      lfo.connect(lg); lg.connect(f.frequency);

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + 2);

      const a = this.amb, t = this.c.currentTime;

      setTimeout(() => { try { a.o1.stop(); a.o2.stop(); a.lfo.stop(); } catch (e) {} }, 800);
      this.amb = null;
    }
  },
};

/* ── 世界状态 ──────────────────────────── */
let seed = (Math.random() * 1e9) | 0;
let rng = mulberry32(seed);
const world = {
  rings: [], balls: [], flyers: [], sparks: [], waves: [], floaters: [], banners: [],
  ringsBroken: 0, score: 0, disp: 0, destroyed: 0,
  combo: 0, comboT: 0, bestCombo: 0, comboPop: 0, act: 0,
};
const cam = { z: 1 };
let shakeX = 0, shakeY = 0, shakeRot = 0, trauma = 0;
let flash = 0, vigPulse = 0, smT = 0, hitStopT = 0, keySlow = false;
let started = false, paused = false, uiHidden = false;
let stars = [];
let quality = 2, emaMs = 16, badT = 0, goodT = 0;
let nowSec = 0, idleT = 0;
const BALL_PAL = [46, 320, 192, 120, 268, 14, 88, 230, 350, 160, 60, 300];
const MILESTONES = new Set([25, 50, 100, 200, 400, 800, 1600]);

const targetSpeed = () => P.ballSpeed * Math.pow(1 + P.speedGain / 100, world.ringsBroken);
const flyerCap = () => quality === 2 ? 650 : quality === 1 ? 450 : 280;
const sparkMul = () => quality === 2 ? 1 : quality === 1 ? .6 : .3;

function setRingColor(ring) {
  const h = ((P.hueBase + ring.idx * P.hueStep) % 360 + 360) % 360;
  ring.hue = h;
  ring.colA = `hsl(${h},92%,64%)`;
  ring.colB = `hsl(${h},85%,50%)`;
  ring.halo = `hsl(${h},95%,60%)`;
}
function makeRing(i) {
  const R = P.baseRadius + i * P.ringGap;
  const r0 = P.pelletSize;
  const n = Math.max(8, Math.min(2600, Math.floor(TAU * R / (r0 * 2 * P.pelletSpacing))));
  const rr = mulberry32((seed ^ 0x9E37) + i * 7919);
  const pellets = [];
  for (let k = 0; k < n; k++) {
    const ang = k / n * TAU;
    const pr = r0 * (0.86 + rr() * 0.28);
    pellets.push({ i: k, ang, x: Math.cos(ang) * R, y: Math.sin(ang) * R, r: pr, alive: true });
  }
  const ring = { idx: i, R, n, alive: n, pr: r0, pellets, broken: false, miss: 0 };
  setRingColor(ring);
  return ring;
}
function ensureRings() {
  while (world.rings.length < world.ringsBroken + 6) world.rings.push(makeRing(world.rings.length));
}
function getActive() {
  const rs = world.rings;
  for (let i = 0; i < rs.length; i++) if (!rs[i].broken) return i;
  return Math.max(0, rs.length - 1);
}
function recolorRings() {
  world.rings.forEach(setRingColor);
  const a = world.rings[world.act];
  if (a) setAccent(a.hue);
}
function setAccent(h) {
  document.documentElement.style.setProperty('--acc', `hsl(${((h % 360) + 360) % 360},90%,62%)`);
}
function buildStars() {
  stars = [];
  const sr = mulberry32(seed ^ 0xAB12CD);
  for (let L = 0; L < 2; L++) {
    const cnt = Math.round(P.starDensity * (L ? 1 : .7));
    for (let i = 0; i < cnt; i++) {
      stars.push({
        nx: sr(), ny: sr(), L,
        sz: (L ? .7 : 1.3) + sr() * 1.2,
        f: .4 + sr() * 2.2, p: sr() * TAU,

    }
  }
}
function spawnBall() {
  const b = {
    x: (rng() - .5) * 30, y: (rng() - .5) * 30,
    r: P.ballRadius,
    hue: BALL_PAL[world.balls.length % BALL_PAL.length],
    trail: [],
  };
  b.col = `hsl(${b.hue},95%,65%)`;
  const a = rng() * TAU, ts = targetSpeed();
  b.vx = Math.cos(a) * ts; b.vy = Math.sin(a) * ts;
  world.balls.push(b);
  spawnWave(b.x, b.y, b.hue, 4, 60, 3, .4);
  return b;
}

/* ── 特效生成 ──────────────────────────── */
function spawnFlyer(p, hue, vx, vy) {
  const f = { x: p.x, y: p.y, vx, vy, r: p.r, col: `hsl(${hue},95%,66%)`, trail: [] };
  world.flyers.push(f);
  const cap = flyerCap();
  if (world.flyers.length > cap) world.flyers.splice(0, world.flyers.length - cap);
}
function spawnSparks(x, y, hue, count, speed) {
  const n = Math.round(count * sparkMul());
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, sp = speed * (.3 + rng() * .9);
    world.sparks.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      t: 0, life: .25 + rng() * .4, hue,
    });
  }
  if (world.sparks.length > 900) world.sparks.splice(0, world.sparks.length - 900);
}
function spawnWave(x, y, hue, r0, r1, lw, life) {
  world.waves.push({ x, y, hue, r0, r1, lw, life, t: 0 });
  if (world.waves.length > 40) world.waves.shift();
}
function spawnFloater(x, y, text) {
  world.floaters.push({ x, y, text, t: 0, life: .8 });
  if (world.floaters.length > 80) world.floaters.shift();
}
function banner(text, sub, hue) {
  world.banners.push({ text, sub, hue, t: 0, life: 1.5 });
  if (world.banners.length > 3) world.banners.shift();
}
function addTrauma(v) { trauma = clamp(trauma + v, 0, 1); }
function hitStop(ms) { if (ms > 0) hitStopT = Math.max(hitStopT, ms / 1000); }
const panOf = x => clamp(x * cam.z / (W * .55), -.9, .9);

/* ── 命中与碎裂 ────────────────────────── */
function hitPellet(ring, idx, src) {
  const p = ring.pellets[idx];
  if (!p || !p.alive || ring.broken) return;
  p.alive = false; ring.alive--;
  world.destroyed++;
  world.combo++; world.comboT = 1.05; world.comboPop = 1;
  if (world.combo > world.bestCombo) world.bestCombo = world.combo;
  const gain = 10 + world.combo;
  world.score += gain;
  const ts = targetSpeed();
  const sp = src ? Math.hypot(src.vx, src.vy) : ts;
  const ox = p.x / ring.R, oy = p.y / ring.R;
  const fvx = ox * sp * .55 + (src ? src.vx * .4 : 0) + (rng() - .5) * sp * .3;
  const fvy = oy * sp * .55 + (src ? src.vy * .4 : 0) + (rng() - .5) * sp * .3;
  spawnFlyer(p, ring.hue, fvx, fvy);
  spawnSparks(p.x, p.y, ring.hue, P.sparks, sp * .5);
  spawnWave(p.x, p.y, ring.hue, p.r, p.r * 7, 3, .3);
  if (P.floaters) spawnFloater(p.x, p.y, '+' + gain);
  addTrauma(.03 * P.shakeAmp + Math.min(.0012 * world.combo, .05));
  audio.hit(world.combo - 1, clamp(sp / 1500, .15, 1), panOf(p.x));
  if (MILESTONES.has(world.combo)) {
    banner(`×${world.combo} COMBO`, '连击里程碑', 48);
    audio.milestone();
    hitStop(P.hitStopMs);
  }
  if (!ring.broken && ring.alive / ring.n <= P.shatterAt / 100) shatterRing(ring);
}

function shatterRing(ring) {
  ring.broken = true;
  world.ringsBroken = Math.max(world.ringsBroken, ring.idx + 1);
  let burst = 0;
  for (const p of ring.pellets) {
    if (!p.alive) continue;
    p.alive = false; ring.alive--;
    if (burst < 420) {
      const sp = 280 + rng() * 460;
      const tx = -p.y / ring.R, ty = p.x / ring.R;
      const tj = (rng() - .5) * 260;
      spawnFlyer(p, ring.hue, p.x / ring.R * sp + tx * tj, p.y / ring.R * sp + ty * tj);
      burst++;
    } else {
      spawnSparks(p.x, p.y, ring.hue, 1, 320);
    }
  }
  const bonus = ring.n * 25;
  world.score += bonus;
  spawnWave(0, 0, ring.hue, ring.R * .92, ring.R * 2.3, 26, .9);
  spawnWave(0, 0, ring.hue, 10, ring.R * 1.1, 10, .55);
  flash = Math.min(flash + .45, .7); vigPulse = .6;
  addTrauma(.5 * P.shakeAmp);
  if (P.slowmoTime > 0) smT = P.slowmoTime;
  banner(`RING ${ring.idx + 1} SHATTERED`, `+${bonus.toLocaleString()} BONUS`, ring.hue);
  audio.shatter(ring.idx);
  if (P.splitEvery > 0 && (ring.idx + 1) % P.splitEvery === 0 && world.balls.length < P.maxBalls) {
    spawnBall();
    banner('+1 BALL', '分裂', BALL_PAL[(world.balls.length - 1) % BALL_PAL.length]);
  }
  ensureRings();
  const nxt = world.rings[getActive()];
  if (nxt) setAccent(nxt.hue);
}

/* ── 物理 ──────────────────────────────── */
function jitterDir(b) {
  if (P.bounceJitter <= 0) return;
  const a = (rng() - .5) * 2 * P.bounceJitter;
  const c = Math.cos(a), s = Math.sin(a);
  const vx = b.vx * c - b.vy * s, vy = b.vx * s + b.vy * c;
  b.vx = vx; b.vy = vy;
}
function nearestAlive(ring, ang, maxOff) {
  const n = ring.n;
  let ci = Math.round(((ang % TAU) + TAU) % TAU / (TAU / n)) % n;
  for (let off = 0; off <= maxOff; off++) {
    let i = (ci + off) % n;
    if (ring.pellets[i].alive) return i;
    i = ((ci - off) % n + n) % n;
    if (ring.pellets[i].alive) return i;
  }
  return -1;
}
function collideBall(b) {
  const d = Math.hypot(b.x, b.y) || .0001;
  if (P.wallMode === 'solid') {
    const ring = world.rings[world.act];
    if (!ring || ring.broken) return;
    if (d + b.r > ring.R - ring.pr) {
      const nx = -b.x / d, ny = -b.y / d;
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; jitterDir(b); }
      const dd = ring.R - ring.pr - b.r - 1;
      b.x *= dd / d; b.y *= dd / d;
      const hitAng = Math.atan2(b.y, b.x);
      const ki = nearestAlive(ring, hitAng, Math.max(6, Math.round(ring.n * .06)));
      if (ki >= 0) { hitPellet(ring, ki, b); ring.miss = 0; }
      else {
        ring.miss++;
        audio.wallTick(panOf(b.x));
        if (ring.miss >= 4) {
          const kk = nearestAlive(ring, hitAng, ring.n);
          if (kk >= 0) hitPellet(ring, kk, b);
          ring.miss = 0;
        }
      }
    }
  } else {
    for (const ring of world.rings) {
      if (ring.broken) continue;
      if (Math.abs(d - ring.R) > b.r + ring.pr * 1.3 + 4) continue;
      const dAng = TAU / ring.n;
      const ca = ((Math.atan2(b.y, b.x) % TAU) + TAU) % TAU;
      const ci = Math.round(ca / dAng) % ring.n;
      const span = Math.ceil((b.r + ring.pr * 1.2) / (ring.R * dAng)) + 1;
      for (let o = -span; o <= span; o++) {
        const idx = ((ci + o) % ring.n + ring.n) % ring.n;
        const p = ring.pellets[idx];
        if (!p.alive) continue;
        const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r;
        if (dx * dx + dy * dy < rr * rr) {
          const dl = Math.sqrt(dx * dx + dy * dy) || .001;
          const nx = dx / dl, ny = dy / dl;
          const dot = b.vx * nx + b.vy * ny;
          if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; jitterDir(b); }
          b.x = p.x + nx * (rr + .5); b.y = p.y + ny * (rr + .5);
          hitPellet(ring, idx, b);
          return;
        }
      }
    }
  }
}
function ballBall() {
  const bs = world.balls;
  for (let i = 0; i < bs.length; i++) {
    for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], c = bs[j];
      const dx = c.x - a.x, dy = c.y - a.y;
      const rr = a.r + c.r, d2 = dx * dx + dy * dy;
      if (d2 > rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      const dvn = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
      if (dvn > 0) {
        a.vx -= dvn * nx; a.vy -= dvn * ny;
        c.vx += dvn * nx; c.vy += dvn * ny;
      }
      const push = (rr - d) / 2 + .5;
      a.x -= nx * push; a.y -= ny * push;
      c.x += nx * push; c.y += ny * push;
      spawnSparks((a.x + c.x) / 2, (a.y + c.y) / 2, a.hue, 5, 260);

}
function step(dt) {
  if (dt <= 0) return;

  world.act = getActive();
  const ts = targetSpeed();
  for (const b of world.balls) {
    b.r = P.ballRadius;
    let sp = Math.hypot(b.vx, b.vy) || 1;
    if (Math.abs(P.gravity) < 1) {
      const k = ts / sp; b.vx *= k; b.vy *= k; sp = ts;
    } else {
      const lo = ts * .5, hi = ts * 1.7;
      if (sp < lo) { const k = lo / sp; b.vx *= k; b.vy *= k; sp = lo; }

    }
    const sub = clamp(Math.ceil(sp * dt / (Math.max(3, P.pelletSize) * .8)), 1, 16);

      b.x += b.vx * h; b.y += b.vy * h;
      collideBall(b);
    }
    if (P.trailLen > 0) {
      b.trail.push(b.x, b.y);

  }
  ballBall();
  // 飞散粒子
  const cullR = Math.hypot(W, H) / (2 * cam.z) + 260;
  for (let i = world.flyers.length - 1; i >= 0; i--) {
    const f = world.flyers[i];
    f.x += f.vx * dt; f.y += f.vy * dt;
    const dr = Math.exp(-dt * .3);
    f.vx *= dr; f.vy *= dr;
    f.trail.push(f.x, f.y);
    if (f.trail.length > 10) f.trail.splice(0, f.trail.length - 10);
    if (Math.hypot(f.x, f.y) > cullR * 1.4) {
      world.flyers[i] = world.flyers[world.flyers.length - 1];
      world.flyers.pop();
    }
  }
  for (let i = world.sparks.length - 1; i >= 0; i--) {
    const s = world.sparks[i];
    s.t += dt;
    if (s.t >= s.life) { world.sparks[i] = world.sparks[world.sparks.length - 1]; world.sparks.pop(); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const dr = Math.exp(-dt * 2.8); s.vx *= dr; s.vy *= dr;
  }
  for (let i = world.waves.length - 1; i >= 0; i--) {
    const w = world.waves[i];
    w.t += dt;
    if (w.t >= w.life) world.waves.splice(i, 1);
  }
  for (let i = world.floaters.length - 1; i >= 0; i--) {
    const f = world.floaters[i];
    f.t += dt;
    if (f.t >= f.life) world.floaters.splice(i, 1);
  }
}

/* ── 点击脉冲 ──────────────────────────── */
function pulse(mx, my) {
  const wx = (mx - W / 2 - shakeX) / cam.z;
  const wy = (my - H / 2 - shakeY) / cam.z;
  spawnWave(wx, wy, 48, 6, 150, 6, .4);
  addTrauma(.16 * P.shakeAmp);
  audio.thump(panOf(wx));
  for (const b of world.balls) {
    const dx = b.x - wx, dy = b.y - wy;
    const d = Math.hypot(dx, dy) || 1;
    const imp = P.pulseForce * Math.exp(-d / 260);
    b.vx += dx / d * imp; b.vy += dy / d * imp;
  }
  const pd = Math.hypot(wx, wy);
  let killed = 0;
  for (const ring of world.rings) {
    if (ring.broken || killed >= 14) continue;
    if (Math.abs(pd - ring.R) > 150) continue;
    for (let idx = 0; idx < ring.n && killed < 14; idx++) {
      const p = ring.pellets[idx];
      if (!p.alive) continue;
      const dx = p.x - wx, dy = p.y - wy;
      if (dx * dx + dy * dy < 140 * 140) { hitPellet(ring, idx, null); killed++; }
    }
  }
}

/* ── 重建 / 重开 ───────────────────────── */
let rebuildTimer = 0;
function queueRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => rebuild(), 280);
}
function rebuild() {
  // 保留进度,按新参数重建世界几何
  world.rings = [];
  ensureRings();
  for (const ring of world.rings) {
    if (ring.idx < world.ringsBroken) {
      ring.broken = true; ring.alive = 0;
      ring.pellets.forEach(p => p.alive = false);
    }
  }
  world.act = getActive();
  const aR = world.rings[world.act];
  for (const b of world.balls) {
    const d = Math.hypot(b.x, b.y);
    if (aR && d > aR.R - aR.pr - b.r - 4) {
      const k = (aR.R * .5) / (d || 1);
      b.x *= k; b.y *= k;
    }
  }
  if (aR) setAccent(aR.hue);
}
function restart(newSeed) {
  if (newSeed != null) seed = newSeed;
  rng = mulberry32(seed);
  Object.assign(world, {
    rings: [], balls: [], flyers: [], sparks: [], waves: [], floaters: [], banners: [],
    ringsBroken: 0, score: 0, disp: 0, destroyed: 0,
    combo: 0, comboT: 0, bestCombo: 0, comboPop: 0, act: 0,
  });
  trauma = 0; flash = 0; vigPulse = 0; smT = 0; hitStopT = 0;
  ensureRings();
  buildStars();
  cam.z = fitZoom();
  if (started) spawnBall();
  setAccent(world.rings[0].hue);
}
function fitZoom() {
  const ring = world.rings[getActive()];
  const viewR = ((ring ? ring.R : P.baseRadius) + P.pelletSize * 2.5) * P.camPad;
  return Math.min(W, H) / 2 / viewR;
}

/* ── 镜头 ──────────────────────────────── */
function camera(rdt) {
  const act = getActive();
  world.act = act;
  let contain = world.rings[act] ? world.rings[act].R : P.baseRadius;
  if (P.wallMode === 'pellet') {
    for (const b of world.balls) {
      const d = Math.hypot(b.x, b.y) + b.r;
      for (const ring of world.rings) {
        if (!ring.broken && ring.R - ring.pr > d) {
          if (ring.R > contain) contain = ring.R;
          break;
        }
      }
    }
  }
  let zT = Math.min(W, H) / 2 / ((contain + P.pelletSize * 2.5) * P.camPad);
  if (!started) zT *= 1 + .025 * Math.sin(idleT * .6); // 待机呼吸
  cam.z += (zT - cam.z) * (1 - Math.exp(-P.zoomSmooth * rdt));
  // 镜头拉远后按需补生成外环(每帧最多 8 个,均摊建造成本)
  const need = Math.hypot(W, H) / (2 * cam.z) + P.ringGap * 2;
  let guard = 0;
  while (world.rings.length && world.rings[world.rings.length - 1].R < need && guard++ < 8) {
    world.rings.push(makeRing(world.rings.length));
  }
  trauma = Math.max(0, trauma - rdt * 1.4);
  const s2 = trauma * trauma, t = nowSec;
  const amp = 26 * P.shakeAmp * RM * s2;
  shakeX = amp * (Math.sin(t * 38.1) * .6 + Math.sin(t * 17.3) * .4);
  shakeY = amp * (Math.cos(t * 31.7) * .6 + Math.cos(t * 19.9) * .4);
  shakeRot = .05 * P.shakeAmp * RM * s2 * (Math.sin(t * 29.3) * .7 + Math.sin(t * 13.1) * .3);
}

/* ── 渲染 ──────────────────────────────── */
function worldTransform(c, s) {
  c.setTransform(s, 0, 0, s, s * (W / 2 + shakeX), s * (H / 2 + shakeY));
  c.rotate(shakeRot);
  c.scale(cam.z, cam.z);
}
function drawRing(c, ring) {
  const pa = new Path2D(), pb = new Path2D(), ph = new Path2D();
  for (const p of ring.pellets) {
    if (!p.alive) continue;
    const t = (p.i & 1) ? pb : pa;
    t.moveTo(p.x + p.r, p.y); t.arc(p.x, p.y, p.r, 0, TAU);
    const hr = p.r * 2.2;
    ph.moveTo(p.x + hr, p.y); ph.arc(p.x, p.y, hr, 0, TAU);
  }
  if (quality > 0) {
    c.globalAlpha = clamp(.085 * P.glow, 0, .4);
    c.fillStyle = ring.halo; c.fill(ph);
  }
  c.globalAlpha = 1;
  c.fillStyle = ring.colA; c.fill(pa);
  c.fillStyle = ring.colB; c.fill(pb);
}
function drawWorldLayer(c, s) {
  // 星空(屏幕空间,仅受震屏视差影响)
  c.setTransform(s, 0, 0, s, 0, 0);
  c.globalCompositeOperation = 'lighter';
  for (const st of stars) {
    const pf = st.L ? .5 : .22;
    const tw = .25 + .45 * (0.5 + 0.5 * Math.sin(nowSec * st.f + st.p));
    c.globalAlpha = tw * (st.L ? 1 : .7);
    c.fillStyle = '#9fb6ff';
    c.fillRect(st.nx * W + shakeX * pf, st.ny * H + shakeY * pf, st.sz, st.sz);
  }
  // 世界空间
  worldTransform(c, s);
  // 冲击波(底层)
  for (const w of world.waves) {
    const k = w.t / w.life, e = 1 - Math.pow(1 - k, 3);
    c.globalAlpha = (1 - k) * .85;
    c.strokeStyle = `hsl(${w.hue},95%,68%)`;
    c.lineWidth = Math.max(w.lw * (1 - k), .7);
    c.beginPath();
    c.arc(w.x, w.y, lerp(w.r0, w.r1, e), 0, TAU);
    c.stroke();
  }
  // 粒子环:近景全量绘制,远景用虚线圆 LOD(圆点近似粒子阵)
  const lo = world.act;
  const cornerR = Math.hypot(W, H) / (2 * cam.z) + P.ringGap;
  let drawn = 0;
  for (let i = lo; i < world.rings.length && drawn < 42; i++) {
    const ring = world.rings[i];
    if (ring.broken) continue;
    if (ring.R - ring.pr * 2 > cornerR) break;
    drawn++;
    if (i <= lo + 4) {
      drawRing(c, ring);
    } else {
      c.globalAlpha = .85;
      c.strokeStyle = ring.colA;
      c.lineWidth = ring.pr * 1.8;
      c.lineCap = 'round';
      c.setLineDash([.5, TAU * ring.R / ring.n - .5]);
      c.beginPath(); c.arc(0, 0, ring.R, 0, TAU); c.stroke();
      c.setLineDash([]);
    }
  }
  // 飞散粒子
  for (const f of world.flyers) {
    if (f.trail.length >= 4) {
      c.globalAlpha = .3;
      c.strokeStyle = f.col;
      c.lineWidth = f.r * .8;
      c.beginPath();
      c.moveTo(f.trail[0], f.trail[1]);
      for (let i = 2; i < f.trail.length; i += 2) c.lineTo(f.trail[i], f.trail[i + 1]);
      c.stroke();
    }
    c.globalAlpha = .95;
    c.fillStyle = f.col;
    c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
  }
  // 主球拖尾
  c.lineCap = 'round';
  const tStep = quality === 0 ? 2 : 1;
  for (const b of world.balls) {
    const n = b.trail.length / 2;
    c.strokeStyle = b.col;
    for (let i = 1; i < n; i += tStep) {
      const a = i / n;
      c.globalAlpha = a * a * .5;
      c.lineWidth = Math.max(b.r * 1.5 * a, .8);
      c.beginPath();
      c.moveTo(b.trail[(i - 1) * 2], b.trail[(i - 1) * 2 + 1]);
      c.lineTo(b.trail[i * 2], b.trail[i * 2 + 1]);
      c.stroke();
    }
  }
  // 主球
  for (const b of world.balls) {
    c.globalAlpha = clamp(.22 * P.glow, 0, .6);
    c.fillStyle = b.col;
    c.beginPath(); c.arc(b.x, b.y, b.r * 3, 0, TAU); c.fill();
    c.globalAlpha = .85;
    c.strokeStyle = b.col; c.lineWidth = 2;
    c.beginPath(); c.arc(b.x, b.y, b.r * 1.45, 0, TAU); c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
  }
  // 火花
  for (const s2 of world.sparks) {
    const k = 1 - s2.t / s2.life;
    c.globalAlpha = k * .9;
    c.strokeStyle = `hsl(${s2.hue},100%,72%)`;
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(s2.x, s2.y);
    c.lineTo(s2.x - s2.vx * .03, s2.y - s2.vy * .03);
    c.stroke();
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}
function project(wx, wy) {
  return [wx * cam.z + W / 2 + shakeX, wy * cam.z + H / 2 + shakeY];
}
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

function drawHUD(c) {
  const hudOn = P.hud && !uiHidden;
  c.textBaseline = 'top';
  // 漂浮分数(投影到屏幕)
  if (P.floaters) {
    c.globalCompositeOperation = 'lighter';
    c.font = '700 13px Bahnschrift, "Arial Narrow", sans-serif';
    c.textAlign = 'center';
    for (const f of world.floaters) {
      const k = f.t / f.life;
      const [sx, sy] = project(f.x, f.y);
      c.globalAlpha = (1 - k) * .9;
      c.fillStyle = '#eaf0ff';
      c.fillText(f.text, sx, sy - 46 * k);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  }
  if (hudOn) {
    // 顶部进度条:当前环剩余
    const ring = world.rings[world.act];
    if (ring) {
      const ratio = ring.alive / ring.n;
      c.fillStyle = `hsl(${ring.hue},90%,60%)`;
      c.globalAlpha = .9;
      c.fillRect(0, 0, W * ratio, 3);
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = .3;
      c.fillRect(0, 0, W * ratio, 7);
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
    }
    // 左上分数块
    c.textAlign = 'left';
    c.fillStyle = '#5e6b8c';
    c.font = '700 10px Bahnschrift, "Arial Narrow", sans-serif';
    try { c.letterSpacing = '0.28em'; } catch (e) {}
    c.fillText('SCORE', 18, 16);
    try { c.letterSpacing = '0em'; } catch (e) {}
    c.fillStyle = '#f2f6ff';
    c.font = '700 34px Bahnschrift, "Arial Narrow", sans-serif';
    c.fillText(Math.round(world.disp).toLocaleString(), 17, 28);
    c.fillStyle = '#5e6b8c';
    c.font = '600 11.5px Bahnschrift, "Arial Narrow", sans-serif';
    c.fillText(`RING ${world.act + 1}    BALLS ${world.balls.length}    HITS ${world.destroyed}    BEST ×${world.bestCombo}`, 18, 68);
    // 右下角状态
    c.textAlign = 'right';
    c.fillStyle = 'rgba(94,107,140,.75)';
    c.font = '600 10px Bahnschrift, "Arial Narrow", sans-serif';
    const fps = Math.round(1000 / Math.max(emaMs, 1));
    c.fillText(`Q${quality} · ${fps} FPS · SEED ${seed}`, W - 14, H - 22);
  }
  // COMBO(录屏模式保留 —— 它就是节目效果)
  if (P.hud && world.combo >= 5) {
    const pop = world.comboPop;
    const hue = (48 - Math.min(world.combo * 1.2, 160) + 360) % 360;
    c.textAlign = 'center';
    const fs = Math.round(40 + pop * 18);
    c.font = `700 ${fs}px Bahnschrift, "Arial Narrow", sans-serif`;
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = .45;
    c.fillStyle = `hsl(${hue},100%,60%)`;
    c.fillText(`×${world.combo}`, W / 2, 30);
    c.globalAlpha = 1;
    c.fillStyle = `hsl(${hue},100%,78%)`;
    c.fillText(`×${world.combo}`, W / 2, 30);
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = 'rgba(94,107,140,.9)';
    c.font = '700 10px Bahnschrift, "Arial Narrow", sans-serif';
    try { c.letterSpacing = '0.4em'; } catch (e) {}
    c.fillText('COMBO', W / 2 + 4, 34 + fs);
    try { c.letterSpacing = '0em'; } catch (e) {}
  }
  // 中央横幅
  if (P.hud) {
    c.textAlign = 'center';
    let bi = 0;
    for (const b of world.banners) {
      const k = b.t / b.life;
      const sc = 1 + (1 - easeOutQuint(Math.min(1, k * 3))) * 1.2;
      const alpha = k < .7 ? 1 : 1 - (k - .7) / .3;
      const y = H * .3 + bi * 56;
      const fs = Math.round(34 * sc);
      c.font = `700 ${fs}px Bahnschrift, "Arial Narrow", sans-serif`;
      try { c.letterSpacing = '0.18em'; } catch (e) {}
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = alpha * .55;
      c.fillStyle = `hsl(${b.hue},95%,62%)`;
      c.fillText(b.text, W / 2, y);
      c.globalAlpha = alpha;
      c.fillStyle = '#f4f7ff';
      c.fillText(b.text, W / 2, y);
      c.globalCompositeOperation = 'source-over';
      if (b.sub) {
        c.globalAlpha = alpha * .8;
        c.font = '600 13px Bahnschrift, "Arial Narrow", sans-serif';
        c.fillStyle = `hsl(${b.hue},80%,72%)`;
        c.fillText(b.sub, W / 2, y + fs + 8);
      }
      try { c.letterSpacing = '0em'; } catch (e) {}
      c.globalAlpha = 1;
      bi++;
    }
  }
  if (paused) {
    c.textAlign = 'center';
    c.fillStyle = 'rgba(242,246,255,.92)';
    c.font = '700 26px Bahnschrift, "Arial Narrow", sans-serif';
    try { c.letterSpacing = '0.3em'; } catch (e) {}
    c.fillText('⏸ PAUSED', W / 2, H * .46);
    try { c.letterSpacing = '0em'; } catch (e) {}
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgC, 0, 0);
  drawWorldLayer(ctx, dpr);
  // Bloom:低分辨率发光层放大叠加
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (P.bloom > 0 && quality > 0) {
    g1x.setTransform(1, 0, 0, 1, 0, 0);
    g1x.globalCompositeOperation = 'source-over';
    g1x.clearRect(0, 0, glow1.width, glow1.height);
    drawWorldLayer(g1x, dpr / 3);
    g1x.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = clamp(P.bloom * .75, 0, 1);
    ctx.drawImage(glow1, 0, 0, cv.width, cv.height);
    if (quality > 1) {
      g2x.setTransform(1, 0, 0, 1, 0, 0);
      g2x.clearRect(0, 0, glow2.width, glow2.height);
      g2x.drawImage(glow1, 0, 0, glow2.width, glow2.height);
      ctx.globalAlpha = clamp(P.bloom * .5, 0, 1);
      ctx.drawImage(glow2, 0, 0, cv.width, cv.height);
    }
    ctx.globalAlpha = 1;
  }
  // 暗角 + 闪光
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vigC, 0, 0);
  if (vigPulse > .01) {
    ctx.globalAlpha = Math.min(vigPulse, .5);
    ctx.drawImage(vigC, 0, 0);
    ctx.globalAlpha = 1;
  }
  if (flash > .004) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(190,210,255,${Math.min(flash * RM, .85)})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 屏幕空间 HUD
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHUD(ctx);
}

/* ── 调参控制台(schema 驱动) ─────────── */
const fmtVal = (s, v) => {
  if (s.type === 'toggle') return v ? 'ON' : 'OFF';
  if (s.type === 'select') { const o = s.opts.find(o => o[0] === v); return o ? o[1] : v; }
  const dec = s.step >= 1 ? 0 : s.step >= .1 ? 1 : 2;
  return (+v).toFixed(dec);
};
const CHANGE_FX = {
  volume: v => audio.setVolume(v),
  wet: v => audio.setWet(v),
  ambient: v => audio.setAmbient(v),
  recolor: () => recolorRings(),

};
const ctrlRefs = {};

        const sel = document.createElement('select');
        s.opts.forEach(([val, txt]) => {
          const o = document.createElement('option');
          o.value = val; o.textContent = txt;
          sel.appendChild(o);
        });
        sel.value = P[s.k];
        sel.onchange = () => applyParam(s, sel.value);
        row.appendChild(sel);
        ctrlRefs[s.k] = { set: v => { sel.value = v; } };
      } else {
        const inp = document.createElement('input');
        inp.type = 'range';
        inp.min = s.min; inp.max = s.max; inp.step = s.step;
        inp.value = P[s.k];
        const val = document.createElement('span');
        val.className = 'rVal'; val.textContent = fmtVal(s, P[s.k]);
        const paint = v => {
          inp.style.setProperty('--fill', ((v - s.min) / (s.max - s.min) * 100) + '%');
          val.textContent = fmtVal(s, v);
        };
        paint(P[s.k]);
        inp.oninput = () => { const v = +inp.value; paint(v); applyParam(s, v); };
        row.appendChild(inp);
        row.appendChild(val);
        ctrlRefs[s.k] = { set: v => { inp.value = v; paint(v); } };
      }
      row.ondblclick = () => {
        applyParam(s, s.def);
        ctrlRefs[s.k].set(s.def);
        toast(`${s.label} → 默认`);
      };
      gi.appendChild(row);
    });
    grp.appendChild(head);
    grp.appendChild(gb);
    body.appendChild(grp);
  });
}
function refreshTuner() {
  SCHEMA.forEach(s => ctrlRefs[s.k] && ctrlRefs[s.k].set(P[s.k]));
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function shot() {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `ballru-${seed}-${Date.now()}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  toast('截图已保存');
}
function paramsJson() { return JSON.stringify({ seed, P }); }
function copyParams() {
  const j = paramsJson();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(j)
      .then(() => toast('参数 JSON 已复制'))
      .catch(() => openPop('copy', j));
  } else openPop('copy', j);
}
let popMode = 'import';
function openPop(mode, text) {
  popMode = mode;
  $('#popTitle').textContent = mode === 'import' ? '导入参数 JSON' : '复制下面的参数 JSON';
  $('#impApply').style.display = mode === 'import' ? '' : 'none';
  const ta = $('#impText');
  ta.value = text || '';
  $('#impPop').classList.add('show');
  ta.focus();
  if (mode === 'copy') ta.select();
}
function closePop() { $('#impPop').classList.remove('show'); }
function applyImport() {
  try {
    const j = JSON.parse($('#impText').value);
    if (!j || typeof j !== 'object' || !j.P) throw 0;
    const np = { ...DEF };
    for (const k in j.P) if (k in DEF) np[k] = j.P[k];
    P = np;
    if (Number.isFinite(j.seed)) seed = j.seed | 0;
    refreshTuner();
    Object.keys(CHANGE_FX).forEach(k => {
      const sc = SCHEMA.find(s => s.change === k);
      if (sc) CHANGE_FX[k](P[sc.k]);
    });
    restart(seed);
    closePop();
    toast('参数已导入并重开');
  } catch (e) {
    toast('JSON 解析失败,请检查格式');
  }
}

/* ── 输入 ──────────────────────────────── */
function togglePause() {
  paused = !paused;
  const b = $('#btnPause');
  if (b) b.textContent = paused ? '▶ 继续 (空格)' : '⏯ 暂停 (空格)';
}
function toggleTuner() { document.body.classList.toggle('tunerAway'); }
function toggleBare() {
  uiHidden = !uiHidden;
  document.body.classList.toggle('bare', uiHidden);
  toast(uiHidden ? '录屏模式:UI 已隐藏,按 H 恢复' : '已退出录屏模式');
}
let preMuteVol = null;
function toggleMute() {
  if (preMuteVol == null) {
    preMuteVol = P.volume;
    P.volume = 0;
  } else {
    P.volume = preMuteVol;
    preMuteVol = null;
  }
  audio.setVolume(P.volume);
  ctrlRefs.volume && ctrlRefs.volume.set(P.volume);
  toast(preMuteVol == null ? '已恢复声音' : '已静音 (M)');
}
addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') {
    if (e.code === 'Escape') closePop();
    return;
  }
  switch (e.code) {
    case 'Space': e.preventDefault(); started ? togglePause() : startGame(); break;
    case 'Enter': if (!started) startGame(); break;
    case 'KeyR': restart(seed); toast('已重开'); break;
    case 'KeyN': restart((Math.random() * 1e9) | 0); toast(`新种子:${seed}`); break;
    case 'KeyC': toggleTuner(); break;
    case 'KeyH': toggleBare(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyS': keySlow = true; break;
    case 'Escape': closePop(); break;
  }
});
addEventListener('keyup', e => { if (e.code === 'KeyS') keySlow = false; });
cv.addEventListener('pointerdown', e => {
  if (!started || paused) return;
  audio.resume();
  if (P.clickPulse) pulse(e.clientX, e.clientY);
});
function startGame() {
  if (started) return;
  started = true;
  audio.resume();
  spawnBall();
  $('#boot').classList.add('gone');
}
$('#boot').addEventListener('pointerdown', startGame);
$('#tHide').onclick = toggleTuner;
$('#tunerTab').onclick = toggleTuner;
$('#impApply').onclick = applyImport;
$('#impCancel').onclick = closePop;
$('#impPop').addEventListener('pointerdown', e => { if (e.target === $('#impPop')) closePop(); });
addEventListener('resize', resize);

/* ── 主循环 ────────────────────────────── */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000;
  last = now;
  rdt = Math.min(rdt, .05);
  nowSec = now / 1000;
  const ms = rdt * 1000;
  emaMs = lerp(emaMs, ms, .06);
  // 自动降质
  if (P.autoQuality) {
    if (emaMs > 19) { badT += rdt; goodT = 0; if (badT > 1.2 && quality > 0) { quality--; badT = 0; toast(`性能保护:画质降至 Q${quality}`); } }
    else if (emaMs < 12.5) { goodT += rdt; badT = 0; if (goodT > 6 && quality < 2) { quality++; goodT = 0; } }
    else { badT = 0; goodT = 0; }
  } else quality = 2;
  // 时间缩放
  let tsc = 1;
  if (smT > 0 && P.slowmoTime > 0) {
    smT -= rdt;
    const k = 1 - Math.max(smT, 0) / P.slowmoTime;
    const sm = k * k * (3 - 2 * k);
    tsc = lerp(P.slowmoScale, 1, sm);
  }
  if (keySlow) tsc = Math.min(tsc, .18);
  if (hitStopT > 0) { hitStopT -= rdt; tsc = 0; }
  if (started && !paused) step(rdt * tsc);
  if (!started) idleT += rdt;
  // 实时层(不受慢动作影响)
  world.disp += (world.score - world.disp) * Math.min(1, rdt * 7);
  world.comboPop = Math.max(0, world.comboPop - rdt * 3.2);
  flash *= Math.exp(-rdt * 6);
  vigPulse *= Math.exp(-rdt * 3);
  for (let i = world.banners.length - 1; i >= 0; i--) {
    const b = world.banners[i];
    b.t += rdt;
    if (b.t >= b.life) world.banners.splice(i, 1);
  }
  camera(rdt);
  render();
}

/* ── 启动 ──────────────────────────────── */
resize();
ensureRings();
cam.z = fitZoom();
setAccent(world.rings[0].hue);
buildTuner();
requestAnimationFrame(frame);
</script>
</body>
